name: Processing production preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: processing-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production deployment access
    if: github.repository == 'liorium/hereisit' && github.ref == 'refs/heads/main'
    environment: processing-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      D1_NAME: hereisit-processing-production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate sealed environment inputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALERT_DESTINATION_ADDRESS: ${{ vars.ALERT_DESTINATION_ADDRESS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
          PRODUCTION_ANALYTICS_READ_TOKEN: ${{ secrets.PRODUCTION_ANALYTICS_READ_TOKEN }}
          PRODUCTION_LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
          PRODUCTION_ABUSE_HMAC_SECRET_CURRENT: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_CURRENT }}
          PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS }}
          PRODUCTION_MAINTAINER_SESSION_ID: ${{ secrets.PRODUCTION_MAINTAINER_SESSION_ID }}
          PRODUCTION_MAINTAINER_HASHES_JSON: ${{ secrets.PRODUCTION_MAINTAINER_HASHES_JSON }}
        run: node scripts/verify-processing-deployment-environment.mjs --environment production
      - name: Verify Cloudflare token identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler whoami
      - name: Inspect current fail-closed processing state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          PRODUCTION_ANALYTICS_READ_TOKEN: ${{ secrets.PRODUCTION_ANALYTICS_READ_TOKEN }}
          PRODUCTION_LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts/preflight
          WORKER_VERSION_FILE="$RUNNER_TEMP/processing-production-worker-version.json"
          trap 'rm -f "$WORKER_VERSION_FILE"' EXIT
          pnpm exec wrangler d1 list --json > .artifacts/preflight/d1-list.json
          DATABASE_ID="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const rows=JSON.parse(readFileSync(".artifacts/preflight/d1-list.json","utf8")); const matches=Array.isArray(rows)?rows.filter((row)=>row?.name===process.env.D1_NAME):[]; if(matches.length!==1||!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(matches[0].uuid))process.exit(1); process.stdout.write(matches[0].uuid)')"
          node scripts/verify-processing-admission-state.mjs \
            --mode inspect-current --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$DATABASE_ID" > .artifacts/preflight/processing-production-state.json
          ACTIVE_VERSION_ID="$(node -e 'const state=require(require("node:path").resolve(process.argv[1]));if(typeof state.activeVersionId!=="string")process.exit(1);process.stdout.write(state.activeVersionId)' .artifacts/preflight/processing-production-state.json)"
          pnpm exec wrangler versions view "$ACTIVE_VERSION_ID" \
            --name hereisit-processing-production --json > "$WORKER_VERSION_FILE"
          node scripts/inspect-processing-cost-providers.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --state .artifacts/preflight/processing-production-state.json \
            --worker-version "$WORKER_VERSION_FILE" \
            > .artifacts/preflight/processing-production-cost-providers.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-production-preflight-${{ github.run_id }}
          path: |
            .artifacts/preflight/processing-production-state.json
            .artifacts/preflight/processing-production-cost-providers.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

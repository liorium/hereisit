name: Image quality benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-quality-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.11.0"

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Build the engine and metric tools once
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          docker buildx build \
            --file apps/image-engine/Dockerfile \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --target benchmark \
            --tag hereisit-image-engine:quality \
            --tag hereisit-image-engine:benchmark \
            --load \
            .
      - name: Run the reduced quality benchmark
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts
          node scripts/create-image-corpus.mjs \
            --verify-clean \
            --runtime-image hereisit-image-engine:quality
          node scripts/create-live-cost-model.mjs \
            --input docs/deployment/processing-staging-cost-input.json \
            --schema docs/deployment/live-cost-model.schema.json \
            --output .artifacts/live-cost-model-pr.json
          node scripts/benchmark-image-engine.mjs \
            --engine-image hereisit-image-engine:quality \
            --metric-image hereisit-image-engine:benchmark \
            --manifest tests/image-corpus/manifest.json \
            --live-cost-model .artifacts/live-cost-model-pr.json \
            --scope pr \
            --output .artifacts/image-benchmark-pr.json
          node scripts/verify-image-quality.mjs \
            --report .artifacts/image-benchmark-pr.json \
            --scope pr
      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-quality-benchmark-${{ github.sha }}
          path: |
            .artifacts/image-benchmark-pr.json
            .artifacts/live-cost-model-pr.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

name: Processing production admission

on:
  workflow_run:
    workflows: ["Processing production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Fail closed to local processing
        required: true
        type: choice
        options: [disable]

permissions:
  actions: read
  contents: read

concurrency:
  group: processing-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.11.0"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  ALERT_DESTINATION_ADDRESS: ${{ vars.ALERT_DESTINATION_ADDRESS }}
  WORKER_SCRIPT_NAME: hereisit-processing-production
  D1_NAME: hereisit-processing-production
  BUCKET_NAME: hereisit-processing-production
  USAGE_LOG_BUCKET_NAME: hereisit-processing-usage-production
  USAGE_ANALYTICS_DATASET_NAME: hereisit_processing_usage_production
  PRODUCT_ANALYTICS_DATASET_NAME: hereisit_product_usage_production
  QUEUE_NAME: hereisit-image-jobs-production
  DLQ_NAME: hereisit-image-jobs-dlq-production
  PDF_QUEUE_NAME: hereisit-pdf-jobs-production
  PDF_DLQ_NAME: hereisit-pdf-jobs-dlq-production
  WRANGLER_CONFIG: .wrangler/generated/wrangler.production.jsonc
  WORKER_MODULE: .artifacts/build/api-worker.mjs
  PRODUCTION_API_ORIGIN: https://api.hereisit.app
  PRODUCTION_PAGES_ORIGIN: https://hereisit.app
  LEGACY_PRODUCTION_PAGES_ORIGIN: https://hereisit.pages.dev
  CANARY_DAILY_WEIGHTED_UNIT_LIMIT: "5000000000"

jobs:
  promote:
    name: Promote the exact production canary to public admission
    if: >-
      github.repository == 'liorium/hereisit' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: processing-production
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCTION_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCTION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: processing-production-canary-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/canary
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          git diff --exit-code
      - name: Bind the exact successful production canary
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCTION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PRODUCTION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          test "$(cat .artifacts/canary/source-sha.txt)" = "$EXPECTED_HEAD_SHA"
          REPORT_SHA256="$(sha256sum .artifacts/canary/authority/processing-release-report.json | cut -d' ' -f1)"
          RELEASE_ID="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/canary/authority/processing-candidate.json --field releaseId)"
          node scripts/verify-processing-deployment-authority.mjs \
            --candidate-root .artifacts/canary/authority \
            --candidate-manifest .artifacts/canary/authority/processing-candidate.json \
            --evidence-bundle ".artifacts/canary/authority/evidence-v1--$RELEASE_ID--processing-evidence.json" \
            --evidence-signature ".artifacts/canary/authority/evidence-v1--$RELEASE_ID--processing-evidence.sig" \
            --public-key .artifacts/canary/authority/evidence-public.pem \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --report .artifacts/canary/authority/processing-release-report.json \
            --expected-git-sha "$EXPECTED_HEAD_SHA" --expected-report-sha256 "$REPORT_SHA256" \
            > .artifacts/canary/release-authority-admission.json
          node scripts/verify-processing-deployment-report.mjs \
            --report .artifacts/canary/processing-deployment-report.json \
            --signature .artifacts/canary/processing-deployment-report.sig \
            --public-key .artifacts/canary/authority/evidence-public.pem \
            --expected-git-sha "$EXPECTED_HEAD_SHA" \
            --expected-release-report-sha256 "$REPORT_SHA256" \
            --release-report .artifacts/canary/authority/processing-release-report.json \
            --candidate .artifacts/canary/authority/processing-candidate.json \
            --worker-attestation .artifacts/canary/worker-version.json \
            --image-digest .artifacts/canary/cloudflare-image-digest.txt \
            --pdf-digest .artifacts/canary/cloudflare-pdf-image-digest.txt \
            --resources .artifacts/canary/resources-production.json \
            --pages-deployment-id .artifacts/canary/pages-deployment-id.txt \
            --image-canary .artifacts/canary/canary-smoke.json \
            --pdf-canary .artifacts/canary/pdf-canary-smoke.json \
            --deletion-receipt .artifacts/canary/pdf-deletion-receipt.json \
            --cost-receipt .artifacts/canary/pdf-cost-receipt.json \
            --rollback-receipt .artifacts/canary/pdf-rollback-receipt.json \
            --admission .artifacts/canary/pdf-public-admission.json \
            --gate .artifacts/canary/gate-results.json \
            --policy .artifacts/canary/policy-smoke.json \
            > .artifacts/canary/deployment-authority-admission.json
          ENGINE_IMAGE="$(cat .artifacts/canary/cloudflare-image-digest.txt)"
          PDF_ENGINE_IMAGE="$(cat .artifacts/canary/cloudflare-pdf-image-digest.txt)"
          [[ "$ENGINE_IMAGE" =~ ^registry\.cloudflare\.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-image-engine@sha256:[0-9a-f]{64}$ ]]
          [[ "$PDF_ENGINE_IMAGE" =~ ^registry\.cloudflare\.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-pdf-engine@sha256:[0-9a-f]{64}$ ]]
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const exact = (value, keys, label) => {
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              throw new Error(`${label} is invalid`);
            }
            if (Object.keys(value).sort().join() !== [...keys].sort().join()) {
              throw new Error(`${label} fields are invalid`);
            }
          };
          const read = async (name) => JSON.parse(await readFile(`.artifacts/canary/${name}`, "utf8"));
          const canary = await read("canary-smoke.json");
          exact(canary, ["schema", "version", "passed", "rolloutPercent", "nonMaintainerLocal", "maintainerServer", "browserPreflight", "exactLengthUpload", "directDownload", "downloadAcknowledged", "sourceFilenameLeak"], "canary smoke");
          if (canary.schema !== "hereisit-processing-production-canary-smoke@1" || canary.version !== 1 || canary.passed !== true || canary.rolloutPercent !== 0 || canary.nonMaintainerLocal !== true || canary.maintainerServer !== true || canary.browserPreflight !== true || canary.exactLengthUpload !== true || canary.directDownload !== true || canary.downloadAcknowledged !== true || canary.sourceFilenameLeak !== false) throw new Error("canary smoke did not pass");
          const gate = await read("gate-results.json");
          exact(gate, ["schema", "version", "passed", "verified"], "canary gate");
          if (gate.schema !== "hereisit-processing-deployment-gate@1" || gate.version !== 1 || gate.passed !== true || gate.verified !== true) throw new Error("canary gate did not pass");
          const policy = await read("policy-smoke.json");
          exact(policy, ["schema", "passed", "execution", "reason", "upload", "queuesPaused"], "canary policy");
          if (policy.passed !== true || policy.execution !== "local" || policy.reason !== "LOCAL_FALLBACK_REQUIRED" || policy.upload !== false || policy.queuesPaused !== true) throw new Error("canary public policy is not local");
          const attestation = await read("worker-version.json");
          exact(attestation, ["schema", "version", "verifiedAt", "workerModuleSha256", "generatedConfigSha256", "releaseReportSha256", "activeVersionId", "previousActive", "versions"], "canary attestation");
          const uuid = /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/;
          const sha = /^[0-9a-f]{64}$/;
          if (attestation.schema !== "hereisit-worker-version-attestations@1" || attestation.version !== 1 || !uuid.test(attestation.activeVersionId) || !sha.test(attestation.workerModuleSha256) || !sha.test(attestation.generatedConfigSha256) || !sha.test(attestation.releaseReportSha256) || attestation.versions?.length !== 6 || attestation.versions.at(-1)?.versionId !== attestation.activeVersionId || attestation.versions.at(-1)?.state !== "active" || attestation.versions.at(-1)?.publicAdmissionPercent !== 0) throw new Error("canary attestation is invalid");
          NODE
          mkdir -p .artifacts/admission .artifacts/build/api-worker-bundle .artifacts/runtime .wrangler/generated
          cp .artifacts/canary/source-sha.txt .artifacts/admission/source-sha.txt
          cp .artifacts/canary/cloudflare-image-digest.txt .artifacts/admission/cloudflare-image-digest.txt
          cp .artifacts/canary/cloudflare-pdf-image-digest.txt .artifacts/admission/cloudflare-pdf-image-digest.txt
          node scripts/create-pdf-public-admission-state.mjs \
            --report .artifacts/canary/authority/processing-release-report.json \
            --deletion-evidence .artifacts/canary/pdf-deletion-receipt.json \
            --cost-evidence .artifacts/canary/pdf-cost-receipt.json \
            --rollback-evidence .artifacts/canary/pdf-rollback-receipt.json \
            --output .artifacts/admission/pdf-public-admission.json \
            > .artifacts/runtime/pdf-public-admission-summary.json
          cmp .artifacts/canary/pdf-public-admission.json \
            .artifacts/admission/pdf-public-admission.json
          PDF_PUBLIC_ADMISSION_ENABLED="$(node -e 'const s=require(process.argv[1]);process.stdout.write(String(s.enabled))' .artifacts/admission/pdf-public-admission.json)"
          echo "PDF_PUBLIC_ADMISSION_ENABLED=$PDF_PUBLIC_ADMISSION_ENABLED" >> "$GITHUB_ENV"
          for name in transition-attestation gate-result policy-result public-smoke-result recovery-result; do
            printf '%s\n' '{"schema":"hereisit-processing-production-admission-pending@1","passed":false}' > ".artifacts/admission/$name.json"
          done
          chmod 0600 .artifacts/admission/*.json
          {
            echo "ENGINE_IMAGE=$ENGINE_IMAGE"
            echo "PDF_ENGINE_IMAGE=$PDF_ENGINE_IMAGE"
            echo "REPORT_SHA256=$REPORT_SHA256"
          } >> "$GITHUB_ENV"
      - name: Install locked tooling and bind the exact CI-built Worker, web, and cost artifacts
        run: |
          set -euo pipefail
          git diff --exit-code
          cp .artifacts/canary/authority/api-worker.mjs "$WORKER_MODULE"
          cp .artifacts/canary/authority/live-cost-model.json .artifacts/runtime/live-cost-model.json
          LIVE_COST_MODEL_SHA256="$(sha256sum .artifacts/runtime/live-cost-model.json | cut -d' ' -f1)"
          PROVIDER_USAGE_SCHEMA_SHA256="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/canary/authority/processing-candidate.json --field providerUsage.schemaSha256)"
          [[ "$LIVE_COST_MODEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PROVIDER_USAGE_SCHEMA_SHA256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "LIVE_COST_MODEL_SHA256=$LIVE_COST_MODEL_SHA256"
            echo "PROVIDER_USAGE_SCHEMA_SHA256=$PROVIDER_USAGE_SCHEMA_SHA256"
          } >> "$GITHUB_ENV"
      - name: Validate sealed production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
          PRODUCTION_ANALYTICS_READ_TOKEN: ${{ secrets.PRODUCTION_ANALYTICS_READ_TOKEN }}
          PRODUCTION_LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
          PRODUCTION_ABUSE_HMAC_SECRET_CURRENT: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_CURRENT }}
          PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS }}
          PRODUCTION_MAINTAINER_SESSION_ID: ${{ secrets.PRODUCTION_MAINTAINER_SESSION_ID }}
          PRODUCTION_MAINTAINER_HASHES_JSON: ${{ secrets.PRODUCTION_MAINTAINER_HASHES_JSON }}
        run: node scripts/verify-processing-deployment-environment.mjs --environment production
      - name: Discover production resources and reconstruct the exact rollout pair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          PRODUCTION_MAINTAINER_HASHES_JSON: ${{ secrets.PRODUCTION_MAINTAINER_HASHES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test "$(node scripts/read-processing-provision-manifest.mjs --file .artifacts/canary/resources-production.json --field accountId)" = "$CLOUDFLARE_ACCOUNT_ID"
          PRODUCTION_D1_DATABASE_ID="$(node scripts/read-processing-provision-manifest.mjs --file .artifacts/canary/resources-production.json --field d1.databaseId)"
          PRODUCTION_LOGPUSH_JOB_ID="$(node scripts/read-processing-provision-manifest.mjs --file .artifacts/canary/resources-production.json --field logpush.jobId)"
          pnpm exec wrangler containers list --json > .artifacts/runtime/container-inventory.json
          PRODUCTION_CONTAINER_APPLICATION_ID="$(node scripts/resolve-cloudflare-container-application.mjs \
            --mode discover --input .artifacts/runtime/container-inventory.json --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name ImageEngineContainer)"
          pnpm exec wrangler containers info "$PRODUCTION_CONTAINER_APPLICATION_ID" > .artifacts/runtime/container-application.json
          node scripts/resolve-cloudflare-container-application.mjs \
            --mode verify --input .artifacts/runtime/container-application.json \
            --output .artifacts/runtime/container-provider-scope.json --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name ImageEngineContainer \
            --application-id "$PRODUCTION_CONTAINER_APPLICATION_ID" --engine-image "$ENGINE_IMAGE" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          PRODUCTION_PDF_CONTAINER_APPLICATION_ID="$(node scripts/resolve-cloudflare-container-application.mjs \
            --mode discover --input .artifacts/runtime/container-inventory.json --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer)"
          pnpm exec wrangler containers info "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" \
            > .artifacts/runtime/pdf-container-application.json
          node scripts/resolve-cloudflare-container-application.mjs \
            --mode verify --input .artifacts/runtime/pdf-container-application.json \
            --output .artifacts/runtime/pdf-container-provider-scope.json --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer \
            --application-id "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" \
            --engine-image "$PDF_ENGINE_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          generate_config() {
            local network_rate_limit_namespace_id rollout_args pdf_admission_json
            if [[ "$1" == current ]]; then
              rollout_args=(--rollout-percent 0)
              network_rate_limit_namespace_id="${PRODUCTION_RUN_ID}${PRODUCTION_RUN_ATTEMPT}"
              pdf_admission_json="$(node -e 'process.stdout.write(JSON.stringify({costPassed:false,deletionPassed:false,enabled:false,releaseReportSha256:process.argv[1],rollbackPassed:false,schema:"hereisit-pdf-public-admission@1",visualProfilesMeasured:0}))' "$REPORT_SHA256")"
            elif [[ "$1" == public ]]; then
              rollout_args=(--rollout-percent 100)
              network_rate_limit_namespace_id=22002
              pdf_admission_json="$(cat .artifacts/admission/pdf-public-admission.json)"
            else
              return 1
            fi
            node scripts/generate-processing-wrangler.mjs \
              --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --database-id "$PRODUCTION_D1_DATABASE_ID" --app-origin "$PRODUCTION_PAGES_ORIGIN" \
              --app-origin "$LEGACY_PRODUCTION_PAGES_ORIGIN" \
              --bucket-name "$BUCKET_NAME" --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
              --usage-analytics-dataset-name "$USAGE_ANALYTICS_DATASET_NAME" \
              --product-analytics-dataset-name "$PRODUCT_ANALYTICS_DATASET_NAME" \
              --cost-accounting-mode active --logpush-job-id "$PRODUCTION_LOGPUSH_JOB_ID" \
              --container-application-id "$PRODUCTION_CONTAINER_APPLICATION_ID" \
              --pdf-container-application-id "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" \
              --queue-name "$QUEUE_NAME" --dlq-name "$DLQ_NAME" --engine-image "$ENGINE_IMAGE" \
              --pdf-queue-name "$PDF_QUEUE_NAME" --pdf-dlq-name "$PDF_DLQ_NAME" \
              --pdf-engine-image "$PDF_ENGINE_IMAGE" \
              --account-daily-weighted-unit-limit "$CANARY_DAILY_WEIGHTED_UNIT_LIMIT" \
              --anonymous-daily-weighted-unit-limit "$CANARY_DAILY_WEIGHTED_UNIT_LIMIT" \
              --network-daily-weighted-unit-limit "$CANARY_DAILY_WEIGHTED_UNIT_LIMIT" \
              --account-pending-job-limit 10 --network-pending-job-limit 3 \
              --maximum-queued-age-seconds 600 --max-live-median-output-ratio-bps 8500 \
              --max-live-p95-weighted-units 150000000 --max-live-original-retained-rate-bps 7000 \
              --max-live-cost-per-1000-microusd 500000 \
              --max-projected-monthly-cost-microusd 5000000 \
              --live-cost-model .artifacts/runtime/live-cost-model.json \
              --live-cost-model-sha256 "$LIVE_COST_MODEL_SHA256" \
              --provider-usage-schema-sha256 "$PROVIDER_USAGE_SCHEMA_SHA256" \
              --release-report-sha256 "$REPORT_SHA256" \
              --pdf-public-admission-json "$pdf_admission_json" \
              --session-rate-limit-namespace-id 22001 \
              --network-rate-limit-namespace-id "$network_rate_limit_namespace_id" \
              --job-read-rate-limit-namespace-id 22003 --result-download-rate-limit-namespace-id 22004 \
              --policy-rate-limit-namespace-id 22005 --job-api-network-rate-limit-namespace-id 22006 \
              --product-analytics-rate-limit-namespace-id 22007 \
              --alert-destination-address "${{ vars.ALERT_DESTINATION_ADDRESS }}" \
              --maintainer-session-hashes-json "$PRODUCTION_MAINTAINER_HASHES_JSON" \
              "${rollout_args[@]}"
          }

          generate_config current
          cp "$WRANGLER_CONFIG" .artifacts/runtime/current-wrangler.jsonc
          pnpm exec wrangler deploy "$WORKER_MODULE" --config "$WRANGLER_CONFIG" \
            --no-bundle --containers-rollout none --dry-run
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const hash = async (path) => createHash("sha256").update(await readFile(path)).digest("hex");
          const canary = JSON.parse(await readFile(".artifacts/canary/worker-version.json", "utf8"));
          if (await hash(process.env.WORKER_MODULE) !== canary.workerModuleSha256 || await hash(".artifacts/runtime/current-wrangler.jsonc") !== canary.generatedConfigSha256 || await hash(".artifacts/canary/authority/processing-release-report.json") !== canary.releaseReportSha256) throw new Error("bound canary artifacts do not match");
          NODE
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json > .artifacts/runtime/versions-before.json
          pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json > .artifacts/runtime/deployment-before.json
          CANARY_VERSION_ID="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=JSON.parse(readFileSync(".artifacts/canary/worker-version.json","utf8")); process.stdout.write(value.activeVersionId)')"
          node --input-type=module - "$CANARY_VERSION_ID" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { verifyActiveWorkerDeployment } from "./scripts/verify-worker-version-chain.mjs";
          verifyActiveWorkerDeployment(JSON.parse(await readFile(".artifacts/runtime/deployment-before.json", "utf8")), process.argv[2], "canary");
          NODE
          node scripts/verify-processing-admission-state.mjs \
            --mode verify --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" --expected-version-id "$CANARY_VERSION_ID" \
            --expected-release-report-sha256 "$REPORT_SHA256" > .artifacts/runtime/preflight.json
          node scripts/capture-processing-queue-states.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --image-primary "$QUEUE_NAME" \
            --image-dlq "$DLQ_NAME" --pdf-primary "$PDF_QUEUE_NAME" \
            --pdf-dlq "$PDF_DLQ_NAME" --output .artifacts/runtime/prior-queue-states.json
          node scripts/processing-admission-rollback-state.mjs \
            --mode capture --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --file .artifacts/runtime/prior-admission-state.json
          generate_config public
          cp "$WRANGLER_CONFIG" .artifacts/runtime/public-wrangler.jsonc
          {
            echo "PRODUCTION_D1_DATABASE_ID=$PRODUCTION_D1_DATABASE_ID"
            echo "CANARY_VERSION_ID=$CANARY_VERSION_ID"
            echo "PRODUCTION_CONTAINER_APPLICATION_ID=$PRODUCTION_CONTAINER_APPLICATION_ID"
            echo "PRODUCTION_PDF_CONTAINER_APPLICATION_ID=$PRODUCTION_PDF_CONTAINER_APPLICATION_ID"
          } >> "$GITHUB_ENV"
      - name: Arm fail-closed mutation recovery
        id: mutation
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"
      - name: Pause and verify both queues before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME"
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy and attest the public Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          : > .artifacts/runtime/public-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/public-deploy.ndjson \
            pnpm exec wrangler deploy "$WORKER_MODULE" --config "$WRANGLER_CONFIG" \
              --no-bundle --containers-rollout none
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json > .artifacts/runtime/versions-after.json
          pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json > .artifacts/runtime/deployment-after.json
          node scripts/verify-worker-version-chain.mjs \
            --mode finalize-admission \
            --before .artifacts/runtime/versions-before.json \
            --after .artifacts/runtime/versions-after.json \
            --deployment-output .artifacts/runtime/public-deploy.ndjson \
            --before-deployment .artifacts/runtime/deployment-before.json \
            --after-deployment .artifacts/runtime/deployment-after.json \
            --current-attestation .artifacts/canary/worker-version.json \
            --worker-module "$WORKER_MODULE" \
            --current-config .artifacts/runtime/current-wrangler.jsonc \
            --next-config .artifacts/runtime/public-wrangler.jsonc \
            --release-report .artifacts/canary/authority/processing-release-report.json \
            --output .artifacts/runtime/transition-attestation.json
          cp .artifacts/runtime/transition-attestation.json .artifacts/admission/transition-attestation.json
          node scripts/apply-worker-version-attestations.mjs \
            --attestation .artifacts/runtime/transition-attestation.json \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --database-id "$PRODUCTION_D1_DATABASE_ID"
          PUBLIC_VERSION_ID="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=JSON.parse(readFileSync(".artifacts/runtime/transition-attestation.json","utf8")); process.stdout.write(value.activeVersionId)')"
          node scripts/verify-processing-admission-state.mjs \
            --mode verify --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" --expected-version-id "$PUBLIC_VERSION_ID" \
            --expected-release-report-sha256 "$REPORT_SHA256" > .artifacts/runtime/post-attestation.json
          echo "PUBLIC_VERSION_ID=$PUBLIC_VERSION_ID" >> "$GITHUB_ENV"
      - name: Verify anonymous public policy before delivery
        run: |
          node --input-type=module - <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { setTimeout as delay } from "node:timers/promises";
          let passed = false;
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(`${process.env.PRODUCTION_API_ORIGIN}/v1/policy`, {
              method: "POST",
              headers: { "content-type": "application/json", origin: process.env.PRODUCTION_PAGES_ORIGIN },
              body: JSON.stringify({ contract: "tool-job@1", toolContract: "image.optimize@1", anonymousSessionId: "018f47a2-65d4-7f31-a377-5afbb8f53f27" }),
            });
            const body = await response.json();
            passed = response.status === 200 && body.maintainer === false && body.execution === "server" && body.reason === null && body.disclosure?.upload === true;
            if (passed) break;
            if (attempt < 60) await delay(2_000);
          }
          if (!passed) throw new Error("production public policy did not converge");
          await writeFile(".artifacts/runtime/policy-result.json", `${JSON.stringify({ schema: "hereisit-processing-production-public-policy-smoke@1", passed: true, maintainer: false, execution: "server", reason: null, upload: true })}\n`, { flag: "wx", mode: 0o600 });
          NODE
          cp .artifacts/runtime/policy-result.json .artifacts/admission/policy-result.json
      - name: Install browser smoke runtime while queues remain paused
        run: pnpm exec playwright install --with-deps chromium
      - name: Resume only primary delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec wrangler queues resume-delivery "$QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs --queue "$QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Run anonymous public production smoke
        run: |
          node --input-type=module - "$PRODUCTION_PAGES_ORIGIN" .artifacts/runtime/public-smoke-result.json <<'NODE'
          import { runProcessingPublicSmokeCli } from "./scripts/smoke-image-compress-server.mjs";
          try {
            await runProcessingPublicSmokeCli({ argv: ["--page-origin", process.argv[2], "--output", process.argv[3]] });
          } catch {
            process.stderr.write("processing production public smoke failed\n");
            process.exitCode = 1;
          }
          NODE
          cp .artifacts/runtime/public-smoke-result.json .artifacts/admission/public-smoke-result.json
      - name: Run anonymous PDF policy and lifecycle smoke only after exact admission evidence
        if: env.PDF_PUBLIC_ADMISSION_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME"
          pnpm exec wrangler queues resume-delivery "$PDF_QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/smoke-pdf-compress-server.mjs \
            --page-origin "$PRODUCTION_PAGES_ORIGIN" --anonymous true \
            --output .artifacts/admission/pdf-public-smoke-result.json
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME"
          pnpm exec wrangler queues resume-delivery "$QUEUE_NAME"
      - name: Verify final operational state and seal success evidence
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-processing-admission-state.mjs \
            --mode verify --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" --expected-version-id "$PUBLIC_VERSION_ID" \
            --expected-release-report-sha256 "$REPORT_SHA256" > .artifacts/runtime/final-state.json
          node scripts/verify-queue-delivery-state.mjs --queue "$QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s\n' '{"schema":"hereisit-processing-production-admission-gate@1","verified":true,"projectedMonthlyCostCeilingMicrousd":5000000,"liveCostPer1000CeilingMicrousd":500000}' > .artifacts/admission/gate-result.json
          printf '%s\n' '{"schema":"hereisit-processing-production-admission-recovery@1","attempted":false,"queuePaused":false,"circuitOpened":false,"versionRestored":false,"localPolicy":false}' > .artifacts/admission/recovery-result.json
          chmod 0600 .artifacts/admission/gate-result.json .artifacts/admission/recovery-result.json
      - name: Attempt every fail-closed recovery layer
        if: always() && steps.mutation.outputs.attempted == 'true' && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CLEANUP_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_CLEANUP_API_TOKEN }}
        run: |
          set +e
          umask 077
          CIRCUIT_RECOVERY=0
          node scripts/verify-processing-admission-state.mjs \
            --mode disable-current --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > .artifacts/runtime/disable-result.json || CIRCUIT_RECOVERY=$?
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME" || true
          pnpm exec wrangler queues pause-delivery "$DLQ_NAME" || true
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME" || true
          pnpm exec wrangler queues pause-delivery "$PDF_DLQ_NAME" || true
          QUEUE_RECOVERY=0
          restore_queue() {
            key="$1"; name="$2"
            expected="$(node -e 'const s=require(process.argv[1]);process.stdout.write(s.queues[process.argv[2]].state)' .artifacts/runtime/prior-queue-states.json "$key")" || { QUEUE_RECOVERY=1; return; }
            if [[ "$expected" == resumed ]]; then action=resume-delivery; else action=pause-delivery; fi
            pnpm exec wrangler queues "$action" "$name" || QUEUE_RECOVERY=$?
            node scripts/verify-queue-delivery-state.mjs --queue "$name" --expected "$expected" --account-id "$CLOUDFLARE_ACCOUNT_ID" || QUEUE_RECOVERY=$?
          }
          VERSION_RECOVERY=0
          cp .artifacts/runtime/current-wrangler.jsonc "$WRANGLER_CONFIG" || VERSION_RECOVERY=$?
          pnpm exec wrangler versions deploy "$CANARY_VERSION_ID@100%" --config "$WRANGLER_CONFIG" --yes || VERSION_RECOVERY=$?
          pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json > .artifacts/runtime/deployment-restored.json || VERSION_RECOVERY=$?
          node --input-type=module - "$CANARY_VERSION_ID" <<'NODE' || VERSION_RECOVERY=$?
          import { readFile } from "node:fs/promises";
          import { verifyActiveWorkerDeployment } from "./scripts/verify-worker-version-chain.mjs";
          verifyActiveWorkerDeployment(JSON.parse(await readFile(".artifacts/runtime/deployment-restored.json", "utf8")), process.argv[2], "restored canary");
          NODE
          pnpm exec wrangler containers info "$PRODUCTION_CONTAINER_APPLICATION_ID" > .artifacts/runtime/container-restored.json || VERSION_RECOVERY=$?
          node scripts/resolve-cloudflare-container-application.mjs --mode verify \
            --input .artifacts/runtime/container-restored.json --output .artifacts/runtime/container-restored-scope.json \
            --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name ImageEngineContainer --application-id "$PRODUCTION_CONTAINER_APPLICATION_ID" \
            --engine-image "$ENGINE_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" || VERSION_RECOVERY=$?
          pnpm exec wrangler containers info "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" > .artifacts/runtime/pdf-container-restored.json || VERSION_RECOVERY=$?
          node scripts/resolve-cloudflare-container-application.mjs --mode verify \
            --input .artifacts/runtime/pdf-container-restored.json --output .artifacts/runtime/pdf-container-restored-scope.json \
            --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer --application-id "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" \
            --engine-image "$PDF_ENGINE_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" || VERSION_RECOVERY=$?
          POLICY_STATE_RECOVERY=0
          node scripts/processing-admission-rollback-state.mjs \
            --mode restore --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --file .artifacts/runtime/prior-admission-state.json || POLICY_STATE_RECOVERY=$?
          POLICY_RECOVERY=0
          node --input-type=module - <<'NODE' || POLICY_RECOVERY=$?
          const response = await fetch(`${process.env.PRODUCTION_API_ORIGIN}/v1/policy`, {
            method: "POST",
            headers: { "content-type": "application/json", origin: process.env.PRODUCTION_PAGES_ORIGIN },
            body: JSON.stringify({ contract: "tool-job@1", toolContract: "image.optimize@1", anonymousSessionId: "018f47a2-65d4-7f31-a377-5afbb8f53f27" }),
          });
          const body = await response.json();
          if (response.status !== 200 || body.execution !== "local" || body.disclosure?.upload !== false) process.exit(1);
          NODE
          ROLLBACK_PREREQUISITES_VERIFIED=false
          if [[ "$CIRCUIT_RECOVERY" -eq 0 && "$VERSION_RECOVERY" -eq 0 && \
            "$POLICY_RECOVERY" -eq 0 && "$POLICY_STATE_RECOVERY" -eq 0 ]]; then
            ROLLBACK_PREREQUISITES_VERIFIED=true
            restore_queue image-primary "$QUEUE_NAME"
            restore_queue image-dlq "$DLQ_NAME"
            restore_queue pdf-primary "$PDF_QUEUE_NAME"
            restore_queue pdf-dlq "$PDF_DLQ_NAME"
          fi
          if [[ "$QUEUE_RECOVERY" -ne 0 || "$ROLLBACK_PREREQUISITES_VERIFIED" != true ]]; then
            ROLLBACK_PREREQUISITES_VERIFIED=false
            node scripts/verify-processing-admission-state.mjs \
              --mode disable-current --account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --database-id "$PRODUCTION_D1_DATABASE_ID" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              > .artifacts/runtime/rollback-restore-failed-circuit-open.json || true
            for queue in "$QUEUE_NAME" "$DLQ_NAME" "$PDF_QUEUE_NAME" "$PDF_DLQ_NAME"; do
              pnpm exec wrangler queues pause-delivery "$queue" || true
              node scripts/verify-queue-delivery-state.mjs --queue "$queue" \
                --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || true
            done
          fi
          node --input-type=module - "$QUEUE_RECOVERY" "$CIRCUIT_RECOVERY" "$VERSION_RECOVERY" "$POLICY_RECOVERY" "$POLICY_STATE_RECOVERY" <<'NODE'
          import { writeFile } from "node:fs/promises";
          const values = process.argv.slice(2).map(Number);
          await writeFile(".artifacts/admission/recovery-result.json", `${JSON.stringify({ schema: "hereisit-processing-production-admission-recovery@2", attempted: true, queuesRestored: values[0] === 0, circuitOpened: values[1] === 0, immutableTripleRestored: values[2] === 0, localPolicy: values[3] === 0, admissionStateRestored: values[4] === 0 })}\n`, { mode: 0o600 });
          NODE
          test "$QUEUE_RECOVERY" -eq 0
          test "$VERSION_RECOVERY" -eq 0
          test "$POLICY_RECOVERY" -eq 0
          test "$POLICY_STATE_RECOVERY" -eq 0
          test "$ROLLBACK_PREREQUISITES_VERIFIED" = true
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: processing-production-admission-${{ github.event.workflow_run.head_sha }}
          path: |
            .artifacts/admission/source-sha.txt
            .artifacts/admission/cloudflare-image-digest.txt
            .artifacts/admission/cloudflare-pdf-image-digest.txt
            .artifacts/admission/pdf-public-admission.json
            .artifacts/admission/transition-attestation.json
            .artifacts/admission/gate-result.json
            .artifacts/admission/policy-result.json
            .artifacts/admission/public-smoke-result.json
            .artifacts/admission/recovery-result.json
          compression-level: 0
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  disable:
    name: Disable public processing and leave delivery paused
    if: >-
      github.repository == 'liorium/hereisit' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.operation == 'disable' &&
      github.ref == 'refs/heads/main'
    environment: processing-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependencies and discover the current D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          pnpm install --frozen-lockfile
          git diff --exit-code
          mkdir -p .artifacts/runtime
          pnpm exec wrangler d1 list --json > .artifacts/runtime/d1-list.json
          PRODUCTION_D1_DATABASE_ID="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const rows=JSON.parse(readFileSync(".artifacts/runtime/d1-list.json","utf8")); const matches=Array.isArray(rows)?rows.filter((row)=>row?.name===process.env.D1_NAME):[]; if(matches.length!==1||!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/.test(matches[0].uuid))process.exit(1); process.stdout.write(matches[0].uuid)')"
          echo "PRODUCTION_D1_DATABASE_ID=$PRODUCTION_D1_DATABASE_ID" >> "$GITHUB_ENV"
      - name: Open the authoritative circuit and pause both queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set +e
          CIRCUIT_DISABLE=0
          node scripts/verify-processing-admission-state.mjs \
            --mode disable-current --account-id "$CLOUDFLARE_ACCOUNT_ID" --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" || CIRCUIT_DISABLE=$?
          QUEUE_DISABLE=0
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME" || QUEUE_DISABLE=$?
          pnpm exec wrangler queues pause-delivery "$DLQ_NAME" || QUEUE_DISABLE=$?
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME" || QUEUE_DISABLE=$?
          pnpm exec wrangler queues pause-delivery "$PDF_DLQ_NAME" || QUEUE_DISABLE=$?
          node scripts/verify-queue-delivery-state.mjs --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || QUEUE_DISABLE=$?
          node scripts/verify-queue-delivery-state.mjs --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || QUEUE_DISABLE=$?
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || QUEUE_DISABLE=$?
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || QUEUE_DISABLE=$?
          POLICY_DISABLE=0
          node --input-type=module - <<'NODE' || POLICY_DISABLE=$?
          const response = await fetch(`${process.env.PRODUCTION_API_ORIGIN}/v1/policy`, {
            method: "POST",
            headers: { "content-type": "application/json", origin: process.env.PRODUCTION_PAGES_ORIGIN },
            body: JSON.stringify({ contract: "tool-job@1", toolContract: "image.optimize@1", anonymousSessionId: "018f47a2-65d4-7f31-a377-5afbb8f53f27" }),
          });
          const body = await response.json();
          if (response.status !== 200 || body.execution !== "local" || body.disclosure?.upload !== false) process.exit(1);
          NODE
          set -e
          test "$CIRCUIT_DISABLE" -eq 0
          test "$QUEUE_DISABLE" -eq 0
          test "$POLICY_DISABLE" -eq 0

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  release-authority:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [verify, browser]
    environment: processing-release-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Download actual browser measurements from this CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-browser-evidence-${{ github.sha }}
          path: .artifacts/browser-evidence
      - name: Install locked release tooling
        run: pnpm install --frozen-lockfile
      - name: Build exact release inputs once
        env:
          NEXT_PUBLIC_PROCESSING_API_ORIGIN: https://api.hereisit.app
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .artifacts/release-source .artifacts/runtime
          export SOURCE_DATE_EPOCH=1786752000
          git archive --format=tar "$GITHUB_SHA" > .artifacts/runtime/exact-source.tar
          for engine in image; do
            dockerfile="apps/$engine-engine/Dockerfile"
            docker buildx build --file "$dockerfile" --platform linux/amd64 \
              --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --target production \
              --tag "hereisit-$engine-engine:$GITHUB_SHA" \
              --output "type=oci,dest=.artifacts/release-source/$engine-engine-linux-amd64.oci.tar,rewrite-timestamp=true" \
              --output "type=docker,dest=.artifacts/release-source/$engine-engine-linux-amd64.docker.tar,rewrite-timestamp=true" .
          done
          mkdir -p .artifacts/build/api-worker-bundle
          pnpm --filter @hereisit/api-worker exec wrangler deploy --config wrangler.local.jsonc \
            --containers-rollout none --dry-run --outdir "$GITHUB_WORKSPACE/.artifacts/build/api-worker-bundle"
          cp .artifacts/build/api-worker-bundle/index.js .artifacts/release-source/api-worker.mjs
          rm -rf apps/web/.next apps/web/out
          NEXT_PUBLIC_PROCESSING_API_ORIGIN=https://hereisit-processing-staging.liorium.workers.dev pnpm --filter @hereisit/web build
          node scripts/create-deterministic-tree-archive.mjs --root apps/web/out \
            --output .artifacts/release-source/web-staging.tar > .artifacts/runtime/web-staging.json
          rm -rf apps/web/.next apps/web/out
          NEXT_PUBLIC_PROCESSING_API_ORIGIN=https://api.hereisit.app pnpm --filter @hereisit/web build
          node scripts/create-deterministic-tree-archive.mjs --root apps/web/out \
            --output .artifacts/release-source/web-production.tar > .artifacts/runtime/web-production.json
          node scripts/verify-and-extract-tree-archive.mjs \
            --archive .artifacts/release-source/web-staging.tar \
            --expected-archive-sha256 "$(node -p 'require("./.artifacts/runtime/web-staging.json").archiveSha256')" \
            --expected-tree-sha256 "$(node -p 'require("./.artifacts/runtime/web-staging.json").treeSha256')" \
            --output .artifacts/runtime/web-staging-scan
          node scripts/verify-and-extract-tree-archive.mjs \
            --archive .artifacts/release-source/web-production.tar \
            --expected-archive-sha256 "$(node -p 'require("./.artifacts/runtime/web-production.json").archiveSha256')" \
            --expected-tree-sha256 "$(node -p 'require("./.artifacts/runtime/web-production.json").treeSha256')" \
            --output .artifacts/runtime/web-production-scan
          cp docs/deployment/provider-usage-schema.v1.json .artifacts/runtime/provider-usage-schema.v1.json
      - name: Generate and verify image engine and application security evidence
        env:
          SYFT_IMAGE: ghcr.io/anchore/syft@sha256:2baa4d24d90599840c0100a8d30deaa533821fcd99f405ce6f90e3d225bd836d
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689
          GRYPE_IMAGE: ghcr.io/anchore/grype@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
        run: |
          set -euo pipefail
          TRIVY_DB_DIGEST="$(docker buildx imagetools inspect ghcr.io/aquasecurity/trivy-db:2 | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$TRIVY_DB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$TRIVY_DB_DIGEST" != "${{ vars.TRIVY_DB_DIGEST }}" ]]; then
            echo "::error title=Stale Trivy DB pin::Rotate TRIVY_DB_DIGEST and start a new workflow run; reruns retain their original variables."
            exit 1
          fi
          mkdir -p .artifacts/runtime/trivy-cache
          docker run --rm -v "$PWD/.artifacts/runtime/trivy-cache:/trivy-cache" "$TRIVY_IMAGE" \
            image --cache-dir /trivy-cache --db-repository "ghcr.io/aquasecurity/trivy-db@$TRIVY_DB_DIGEST" \
            --download-db-only
          mkdir -p .artifacts/runtime/grype-cache
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=512m \
            --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_CACHE_DIR=/cache \
            -v "$PWD/.artifacts/runtime/grype-cache:/cache" "$GRYPE_IMAGE" db update
          GRYPE_DB_SHA256="$(sha256sum .artifacts/runtime/grype-cache/6/vulnerability.db | cut -d' ' -f1)"
          docker load --input .artifacts/release-source/image-engine-linux-amd64.docker.tar
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/fixtures/native/libvips-source-bounds.c \
            -ldl -o .artifacts/runtime/libvips-source-bounds
          timeout 15s docker run --rm --network none --read-only --memory 128m --memory-swap 128m \
            --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/.artifacts/runtime/libvips-source-bounds:/probe:ro" --entrypoint /probe \
            "hereisit-image-engine:$GITHUB_SHA" \
            > .artifacts/runtime/security-libvips-source-bounds.json
          IMAGE_ENGINE_SHA256="$(docker image inspect "hereisit-image-engine:$GITHUB_SHA" --format '{{.Id}}' | sed 's/^sha256://')"
          WEB_STAGING_SHA256="$(sha256sum .artifacts/release-source/web-staging.tar | cut -d' ' -f1)"
          WEB_PRODUCTION_SHA256="$(sha256sum .artifacts/release-source/web-production.tar | cut -d' ' -f1)"
          WORKER_SHA256="$(sha256sum .artifacts/release-source/api-worker.mjs | cut -d' ' -f1)"
          LOCKFILE_SHA256="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          for scope in engine web-staging web-production worker lockfile; do
            case "$scope" in
              engine) artifact=.artifacts/release-source/image-engine-linux-amd64.docker.tar; artifact_sha256="$IMAGE_ENGINE_SHA256"; scanner_artifact="/repo/$artifact"; source="docker-archive:/repo/$artifact"; trivy=(image --input "/repo/$artifact") ;;
              web-staging) artifact=.artifacts/release-source/web-staging.tar; artifact_sha256="$WEB_STAGING_SHA256"; scanner_artifact="/repo/.artifacts/runtime/$scope-scan"; source="dir:/repo/.artifacts/runtime/$scope-scan"; trivy=(filesystem "/repo/.artifacts/runtime/$scope-scan") ;;
              web-production) artifact=.artifacts/release-source/web-production.tar; artifact_sha256="$WEB_PRODUCTION_SHA256"; scanner_artifact="/repo/.artifacts/runtime/$scope-scan"; source="dir:/repo/.artifacts/runtime/$scope-scan"; trivy=(filesystem "/repo/.artifacts/runtime/$scope-scan") ;;
              worker) artifact=.artifacts/release-source/api-worker.mjs; artifact_sha256="$WORKER_SHA256"; scanner_artifact="/repo/$artifact"; source="file:$scanner_artifact"; trivy=(filesystem "$scanner_artifact") ;;
              lockfile) artifact=pnpm-lock.yaml; artifact_sha256="$LOCKFILE_SHA256"; scanner_artifact="/repo/$artifact"; source="file:$scanner_artifact"; trivy=(filesystem "$scanner_artifact") ;;
            esac
            syft_catalogers=()
            trivy_output=".artifacts/release-source/security-trivy-$scope.json"
            if [[ "$scope" == engine ]]; then
              syft_catalogers=(--select-catalogers +sbom-cataloger)
              trivy_output=".artifacts/runtime/security-trivy-$scope.normalized.json"
            fi
            docker run --rm -v "$PWD:/repo:ro" "$SYFT_IMAGE" "$source" "${syft_catalogers[@]}" -o cyclonedx-json \
              > ".artifacts/runtime/security-sbom-$scope.raw.json"
            docker run --rm -v "$PWD:/repo:ro" -v "$PWD/.artifacts/runtime/trivy-cache:/trivy-cache" "$TRIVY_IMAGE" \
              "${trivy[@]}" --cache-dir /trivy-cache --skip-db-update --offline-scan --format json \
              > ".artifacts/runtime/security-trivy-$scope.raw.json"
            node scripts/normalize-processing-security-evidence.mjs --scope "$scope" \
              --artifact-sha256 "$artifact_sha256" \
              --expected-scanner-artifact "$scanner_artifact" \
              --sbom-input ".artifacts/runtime/security-sbom-$scope.raw.json" \
              --sbom-output ".artifacts/release-source/security-sbom-$scope.cdx.json" \
              --trivy-input ".artifacts/runtime/security-trivy-$scope.raw.json" \
              --trivy-output "$trivy_output"
            if [[ "$scope" == engine ]]; then
              docker run --rm --network none --read-only \
                --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=512m \
                --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
                -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_CACHE_DIR=/cache \
                -e GRYPE_DB_AUTO_UPDATE=false -e GRYPE_DB_MAX_ALLOWED_BUILT_AGE=24h \
                -e GRYPE_MATCH_UPSTREAM_KERNEL_HEADERS=true \
                -v "$PWD:/repo:ro" -v "$PWD/.artifacts/runtime/grype-cache:/cache:ro" \
                "$GRYPE_IMAGE" "sbom:/repo/.artifacts/release-source/security-sbom-$scope.cdx.json" -o json \
                > ".artifacts/runtime/security-grype-$scope.raw.json"
              node scripts/native-vulnerability-evidence.mjs \
                --trivy "$trivy_output" --grype ".artifacts/runtime/security-grype-$scope.raw.json" \
                --sbom ".artifacts/release-source/security-sbom-$scope.cdx.json" \
                --database .artifacts/runtime/grype-cache/6/vulnerability.db --database-sha256 "$GRYPE_DB_SHA256" \
                --artifact-sha256 "$artifact_sha256" --output ".artifacts/release-source/security-trivy-$scope.json"
            fi
          done
          node scripts/verify-image-engine-licenses.mjs \
            --scope pr \
            --image "hereisit-image-engine:$GITHUB_SHA" \
            --artifact-sha256 "$IMAGE_ENGINE_SHA256" \
            --lock apps/image-engine/native/sources.lock.json \
            --policy apps/image-engine/licenses/policy.json \
            --exceptions apps/image-engine/security/vulnerability-exceptions.json \
            --base-lock apps/image-engine/base-images.lock.json \
            --output .artifacts/release-source/security-image-engine-license-gate.json
          node scripts/application-supply-chain.mjs --mode verify --repository . \
            --policy security/application-license-policy.json --lockfile pnpm-lock.yaml \
            --notices-output apps/web/public/THIRD_PARTY_NOTICES.txt \
            --gate-output .artifacts/release-source/security-application-supply-chain-gate.json \
            --engine-sbom .artifacts/release-source/security-sbom-engine.cdx.json --engine-artifact-sha256 "$IMAGE_ENGINE_SHA256" \
            --web-staging-sbom .artifacts/release-source/security-sbom-web-staging.cdx.json --web-staging-artifact-sha256 "$WEB_STAGING_SHA256" \
            --web-production-sbom .artifacts/release-source/security-sbom-web-production.cdx.json --web-production-artifact-sha256 "$WEB_PRODUCTION_SHA256" \
            --worker-sbom .artifacts/release-source/security-sbom-worker.cdx.json --worker-artifact-sha256 "$WORKER_SHA256" \
            --lockfile-sbom .artifacts/release-source/security-sbom-lockfile.cdx.json --lockfile-artifact-sha256 "$LOCKFILE_SHA256"
          node scripts/verify-vulnerability-results.mjs \
            --engine-sbom .artifacts/release-source/security-sbom-engine.cdx.json \
            --engine-report .artifacts/release-source/security-trivy-engine.json --engine-artifact-sha256 "$IMAGE_ENGINE_SHA256" \
            --web-staging-report .artifacts/release-source/security-trivy-web-staging.json --web-staging-artifact-sha256 "$WEB_STAGING_SHA256" \
            --web-production-report .artifacts/release-source/security-trivy-web-production.json --web-production-artifact-sha256 "$WEB_PRODUCTION_SHA256" \
            --worker-report .artifacts/release-source/security-trivy-worker.json --worker-artifact-sha256 "$WORKER_SHA256" \
            --lockfile-report .artifacts/release-source/security-trivy-lockfile.json --lockfile-artifact-sha256 "$LOCKFILE_SHA256" \
            --scanner-policy security/vulnerability-scan-policy.json \
            --engine-exceptions apps/image-engine/security/vulnerability-exceptions.json \
            --application-exceptions security/application-vulnerability-exceptions.json \
            --trivy-db-digest "$TRIVY_DB_DIGEST" \
            --output .artifacts/release-source/security-vulnerability-gate.json
      - name: Preserve failed security diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-security-failure-${{ github.sha }}
          path: |
            .artifacts/runtime/security-*.json
            .artifacts/release-source/security-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Measure the exact production image and create hosted image evidence
        run: |
          set -euo pipefail
          umask 077
          docker buildx build --file apps/image-engine/Dockerfile --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=1786752000 --target benchmark \
            --tag hereisit-image-metrics:release --load .
          pnpm --filter @hereisit/image-engine exec esbuild src/pipeline/benchmark-verify.ts \
            --bundle --platform=node --format=esm --target=node24 --external:sharp \
            --outfile=dist/benchmark-verify.mjs
          node scripts/create-image-corpus.mjs --verify-clean --runtime-image "hereisit-image-engine:$GITHUB_SHA"
          node scripts/create-live-cost-model.mjs --input docs/deployment/processing-staging-cost-input.json \
            --schema docs/deployment/live-cost-model.schema.json --output .artifacts/runtime/native-cost-estimate.json
          node scripts/benchmark-image-engine.mjs --engine-image "hereisit-image-engine:$GITHUB_SHA" \
            --metric-image hereisit-image-metrics:release --manifest tests/image-corpus/manifest.json \
            --live-cost-model .artifacts/runtime/native-cost-estimate.json --scope release \
            --output .artifacts/runtime/image-benchmark-release.json
          node scripts/create-image-release-evidence.mjs --source .artifacts/runtime/exact-source.tar \
            --source-lock apps/image-engine/native/sources.lock.json \
            --benchmark .artifacts/runtime/image-benchmark-release.json --manifest tests/image-corpus/manifest.json \
            --browser .artifacts/browser-evidence/evidence.json \
            --license .artifacts/release-source/security-image-engine-license-gate.json \
            --git-sha "$GITHUB_SHA" --check-run-id "$GITHUB_RUN_ID" \
            --engine-image-digest "$(docker image inspect "hereisit-image-engine:$GITHUB_SHA" --format '{{.Id}}')" \
            --output .artifacts/hosted-check
      - name: Preserve measured image release results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-release-measurements-${{ github.sha }}
          path: |
            .artifacts/runtime/image-benchmark-release.json
            .artifacts/hosted-check/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Create signed @3 candidate and exact report authority
        env:
          PROCESSING_EVIDENCE_PRIVATE_KEY: ${{ secrets.PROCESSING_EVIDENCE_PRIVATE_KEY }}
          PROCESSING_EVIDENCE_PUBLIC_KEY: ${{ secrets.PROCESSING_EVIDENCE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          RELEASE_ID="$(date -u +%F).${GITHUB_RUN_ATTEMPT}"
          test -n "$PROCESSING_EVIDENCE_PRIVATE_KEY"
          PRIVATE_KEY_PATH="$RUNNER_TEMP/processing-evidence-private-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.pem"
          trap 'rm -f -- "$PRIVATE_KEY_PATH"' EXIT
          printf '%s' "$PROCESSING_EVIDENCE_PRIVATE_KEY" > "$PRIVATE_KEY_PATH"
          chmod 0600 "$PRIVATE_KEY_PATH"
          printf '%s' "$PROCESSING_EVIDENCE_PUBLIC_KEY" > .artifacts/runtime/evidence-public.pem
          node scripts/prepare-processing-ci-release-source.mjs \
            --source-root .artifacts/release-source --runtime-root .artifacts/runtime \
            --release-id "$RELEASE_ID" --git-sha "$GITHUB_SHA" \
            --source-archive .artifacts/runtime/exact-source.tar
          node scripts/create-processing-candidate.mjs --source-root .artifacts/release-source \
            --output-root .artifacts/built-candidate --release-id "$RELEASE_ID" --git-sha "$GITHUB_SHA" \
            --staging-processing-api-origin https://hereisit-processing-staging.liorium.workers.dev \
            --production-processing-api-origin https://api.hereisit.app \
            --staging-web-tree-sha256 "$(node -p 'require("./.artifacts/runtime/web-staging.json").treeSha256')" \
            --production-web-tree-sha256 "$(node -p 'require("./.artifacts/runtime/web-production.json").treeSha256')" \
            --trivy-db-digest "${{ vars.TRIVY_DB_DIGEST }}" \
            --provider-usage-schema docs/deployment/provider-usage-schema.v1.json
          node scripts/prepare-processing-ci-evidence.mjs --candidate .artifacts/built-candidate/processing-candidate.json \
            --release-id "$RELEASE_ID" --git-sha "$GITHUB_SHA" \
            --source-sha256 "$(sha256sum .artifacts/runtime/exact-source.tar | cut -d' ' -f1)" \
            --hosted-check-root .artifacts/hosted-check --output .artifacts/runtime/evidence.json
          node scripts/processing-evidence-signature.mjs --mode sign --bundle .artifacts/runtime/evidence.json \
            --signature .artifacts/runtime/evidence.sig --private-key "$PRIVATE_KEY_PATH" --repository-root .
          node scripts/create-processing-release-report.mjs --candidate-root .artifacts/built-candidate \
            --candidate-manifest .artifacts/built-candidate/processing-candidate.json \
            --evidence-bundle .artifacts/runtime/evidence.json --evidence-signature .artifacts/runtime/evidence.sig \
            --public-key .artifacts/runtime/evidence-public.pem --now "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --output .artifacts/runtime/processing-release-report.json
          node scripts/finalize-processing-candidate.mjs --built-root .artifacts/built-candidate \
            --output-root .artifacts/release-authority --report .artifacts/runtime/processing-release-report.json \
            --evidence-bundle .artifacts/runtime/evidence.json --evidence-signature .artifacts/runtime/evidence.sig
          cp .artifacts/runtime/evidence-public.pem .artifacts/release-authority/evidence-public.pem
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-release-authority-${{ github.sha }}
          path: .artifacts/release-authority
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  browser:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    # Keep WebKit on one worker: its short-lived progress and download events become flaky under contention.
    timeout-minutes: 60
    env:
      HEREISIT_E2E_SERVER_MODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hereisit/web build
        env:
          ALLOW_LOCAL_PROCESSING_ORIGINS: "1"
          NEXT_PUBLIC_PROCESSING_API_ORIGIN: http://127.0.0.1:4173
          NEXT_PUBLIC_PRODUCT_ANALYTICS_DISABLED: "1"
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test browser matrix
        run: |
          mkdir -p .artifacts/browser-json
          set +e
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/primary \
            PLAYWRIGHT_JSON_OUTPUT_NAME=.artifacts/browser-json/primary.json \
            pnpm test:e2e:ci \
            --reporter=github,html,json \
            --project=chromium \
            --project=firefox \
            --project=mobile-chromium \
            --project=mobile-firefox \
            --output=test-results/primary
          primary_status=$?
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/webkit \
            PLAYWRIGHT_JSON_OUTPUT_NAME=.artifacts/browser-json/webkit.json \
            pnpm test:e2e:ci \
            --reporter=github,html,json \
            --project=webkit \
            --project=mobile-webkit \
            --workers=1 \
            --output=test-results/webkit
          webkit_status=$?
          if (( primary_status != 0 || webkit_status != 0 )); then
            exit 1
          fi
      - name: Build product analytics fixture
        run: pnpm --filter @hereisit/web build
        env:
          ALLOW_LOCAL_PROCESSING_ORIGINS: "1"
          NEXT_PUBLIC_PROCESSING_API_ORIGIN: http://127.0.0.1:4173
      - name: Test product analytics
        run: >-
          pnpm test:e2e:ci
          tests/e2e/product-analytics.spec.ts
          tests/e2e/image-workbench.spec.ts
          --project=chromium
          --grep analytics
          --reporter=github,html,json
        env:
          HEREISIT_E2E_PRODUCT_ANALYTICS: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: .artifacts/browser-json/analytics.json
      - name: Summarize real browser privacy and device coverage
        run: |
          set -euo pipefail
          umask 077
          git archive --format=tar "$GITHUB_SHA" > .artifacts/browser-json/exact-source.tar
          node scripts/create-image-browser-evidence.mjs \
            --primary .artifacts/browser-json/primary.json --webkit .artifacts/browser-json/webkit.json \
            --analytics .artifacts/browser-json/analytics.json --source .artifacts/browser-json/exact-source.tar \
            --git-sha "$GITHUB_SHA" --check-run-id "$GITHUB_RUN_ID" \
            --output .artifacts/browser-evidence/evidence.json
      - name: Upload sanitized browser measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-browser-evidence-${{ github.sha }}
          path: .artifacts/browser-evidence/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  browser:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    # Keep WebKit on one worker: its short-lived progress and download events become flaky under contention.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hereisit/web build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test browser matrix
        run: |
          set +e
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/primary \
            pnpm test:e2e:ci \
            --project=chromium \
            --project=firefox \
            --project=mobile-chromium \
            --project=mobile-firefox \
            --output=test-results/primary
          primary_status=$?
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/webkit \
            pnpm test:e2e:ci \
            --project=webkit \
            --project=mobile-webkit \
            --workers=1 \
            --output=test-results/webkit
          webkit_status=$?
          if (( primary_status != 0 || webkit_status != 0 )); then
            exit 1
          fi
      - name: Build product analytics fixture
        run: pnpm --filter @hereisit/web build
        env:
          ALLOW_LOCAL_PROCESSING_ORIGINS: "1"
          NEXT_PUBLIC_PROCESSING_API_ORIGIN: http://127.0.0.1:4173
      - name: Test product analytics
        run: >-
          pnpm test:e2e:ci
          tests/e2e/product-analytics.spec.ts
          tests/e2e/image-workbench.spec.ts
          tests/e2e/pdf-tools.spec.ts
          --project=chromium
          --grep analytics
        env:
          HEREISIT_E2E_PRODUCT_ANALYTICS: "1"
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

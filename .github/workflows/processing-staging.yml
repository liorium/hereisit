name: Processing staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: processing-staging
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.11.0"

jobs:
  deploy:
    name: Deploy successful main CI commit to staging
    if: >-
      github.repository == 'liorium/hereisit' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: processing-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ALERT_DESTINATION_ADDRESS: ${{ vars.ALERT_DESTINATION_ADDRESS }}
      WORKER_SCRIPT_NAME: hereisit-processing-staging
      D1_NAME: hereisit-processing-staging
      BUCKET_NAME: hereisit-processing-staging
      USAGE_LOG_BUCKET_NAME: hereisit-processing-usage-staging
      USAGE_ANALYTICS_DATASET_NAME: hereisit_processing_usage_staging
      PRODUCT_ANALYTICS_DATASET_NAME: hereisit_product_usage_staging
      QUEUE_NAME: hereisit-image-jobs-staging
      DLQ_NAME: hereisit-image-jobs-dlq-staging
      PDF_QUEUE_NAME: hereisit-pdf-jobs-staging
      PDF_DLQ_NAME: hereisit-pdf-jobs-dlq-staging
      WRANGLER_CONFIG: .wrangler/generated/wrangler.staging.jsonc
      WORKER_MODULE: .artifacts/build/api-worker.mjs
      STAGING_API_ORIGIN: https://hereisit-processing-staging.liorium.workers.dev
      STAGING_PAGES_ORIGIN: https://processing-staging.hereisit.pages.dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: processing-release-authority-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/authority
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Bind the exact successful CI source
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p .artifacts/build .artifacts/deployment .artifacts/runtime .wrangler/generated
          printf '%s\n' "$EXPECTED_HEAD_SHA" > .artifacts/deployment/source-sha.txt
          test "$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field gitSha)" = "$EXPECTED_HEAD_SHA"
          REPORT_SHA256="$(sha256sum .artifacts/authority/processing-release-report.json | cut -d' ' -f1)"
          RELEASE_ID="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field releaseId)"
          node scripts/verify-processing-deployment-authority.mjs \
            --candidate-root .artifacts/authority \
            --candidate-manifest .artifacts/authority/processing-candidate.json \
            --evidence-bundle ".artifacts/authority/evidence-v1--$RELEASE_ID--processing-evidence.json" \
            --evidence-signature ".artifacts/authority/evidence-v1--$RELEASE_ID--processing-evidence.sig" \
            --public-key .artifacts/authority/evidence-public.pem \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --report .artifacts/authority/processing-release-report.json \
            --expected-git-sha "$EXPECTED_HEAD_SHA" --expected-report-sha256 "$REPORT_SHA256" \
            > .artifacts/deployment/release-authority.json
          cp .artifacts/authority/processing-candidate.json .artifacts/deployment/processing-candidate.json
          cp .artifacts/authority/processing-release-report.json .artifacts/deployment/processing-release-report.json
          cp .artifacts/authority/evidence-public.pem .artifacts/deployment/evidence-public.pem
          echo "REPORT_SHA256=$REPORT_SHA256" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          git diff --exit-code
      - name: Validate sealed deployment environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
          STAGING_ANALYTICS_READ_TOKEN: ${{ secrets.STAGING_ANALYTICS_READ_TOKEN }}
          STAGING_LOGPUSH_STATUS_TOKEN: ${{ secrets.STAGING_LOGPUSH_STATUS_TOKEN }}
          STAGING_ABUSE_HMAC_SECRET_CURRENT: ${{ secrets.STAGING_ABUSE_HMAC_SECRET_CURRENT }}
          STAGING_ABUSE_HMAC_SECRET_PREVIOUS: ${{ secrets.STAGING_ABUSE_HMAC_SECRET_PREVIOUS }}
          STAGING_MAINTAINER_SESSION_ID: ${{ secrets.STAGING_MAINTAINER_SESSION_ID }}
          STAGING_MAINTAINER_HASHES_JSON: ${{ secrets.STAGING_MAINTAINER_HASHES_JSON }}
        run: node scripts/verify-processing-deployment-environment.mjs
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Bind CI-built engine, Worker, web, benchmark, cost, SBOM, Trivy, and license assets
        run: |
          set -euo pipefail
          umask 077
          cp .artifacts/authority/api-worker.mjs "$WORKER_MODULE"
          cp .artifacts/authority/live-cost-model.json .artifacts/runtime/live-cost-model.json
          cp .artifacts/authority/image-engine-linux-amd64.docker.tar .artifacts/build/image-engine-linux-amd64.docker.tar
          cp .artifacts/authority/pdf-engine-linux-amd64.docker.tar .artifacts/build/pdf-engine-linux-amd64.docker.tar
          docker load --input .artifacts/build/image-engine-linux-amd64.docker.tar
          docker load --input .artifacts/build/pdf-engine-linux-amd64.docker.tar
          LOCAL_IMAGE_CONFIG_DIGEST="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field engine.oci.configDigest)"
          LOCAL_PDF_CONFIG_DIGEST="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field pdfEngine.oci.configDigest)"
          LIVE_COST_MODEL_SHA256="$(sha256sum .artifacts/runtime/live-cost-model.json | cut -d' ' -f1)"
          PROVIDER_USAGE_SCHEMA_SHA256="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field providerUsage.schemaSha256)"
          rm -rf apps/web/out
          node scripts/verify-and-extract-tree-archive.mjs \
            --archive .artifacts/authority/web-staging.tar \
            --expected-archive-sha256 "$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field web.staging.archiveSha256)" \
            --expected-tree-sha256 "$(node scripts/read-processing-candidate.mjs --manifest .artifacts/authority/processing-candidate.json --field web.staging.treeSha256)" \
            --output apps/web/out
          {
            echo "LOCAL_IMAGE_CONFIG_DIGEST=$LOCAL_IMAGE_CONFIG_DIGEST"
            echo "LOCAL_PDF_CONFIG_DIGEST=$LOCAL_PDF_CONFIG_DIGEST"
            echo "LIVE_COST_MODEL_SHA256=$LIVE_COST_MODEL_SHA256"
            echo "PROVIDER_USAGE_SCHEMA_SHA256=$PROVIDER_USAGE_SCHEMA_SHA256"
          } >> "$GITHUB_ENV"
      - name: Publish and bind the immutable engine image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          IMAGE_CONFIG_HEX="${LOCAL_IMAGE_CONFIG_DIGEST#sha256:}"
          [[ "$IMAGE_CONFIG_HEX" =~ ^[0-9a-f]{64}$ ]]
          REGISTRY_IMAGE_TAG="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-image-engine:$EXPECTED_HEAD_SHA-$IMAGE_CONFIG_HEX"
          docker tag "hereisit-image-engine:$EXPECTED_HEAD_SHA" "$REGISTRY_IMAGE_TAG"
          pnpm exec wrangler containers push "$REGISTRY_IMAGE_TAG"
          for attempt in {1..30}; do
            if docker manifest inspect -v "$REGISTRY_IMAGE_TAG" \
                > .artifacts/runtime/cloudflare-container-manifest.json \
                2> .artifacts/runtime/cloudflare-container-manifest.stderr &&
              node scripts/resolve-cloudflare-image-digest.mjs \
                --manifest .artifacts/runtime/cloudflare-container-manifest.json \
                --expected-config-digest "$LOCAL_IMAGE_CONFIG_DIGEST" \
                --image-ref "$REGISTRY_IMAGE_TAG" \
                --account-id "$CLOUDFLARE_ACCOUNT_ID" \
                --output .artifacts/deployment/cloudflare-image-digest.txt \
                2>> .artifacts/runtime/cloudflare-container-manifest.stderr; then
              break
            fi
            if (( attempt == 30 )); then
              cat .artifacts/runtime/cloudflare-container-manifest.stderr >&2
              exit 1
            fi
            sleep 5
          done
          rm -f .artifacts/runtime/cloudflare-container-manifest.stderr
          echo "ENGINE_IMAGE=$(cat .artifacts/deployment/cloudflare-image-digest.txt)" >> "$GITHUB_ENV"

          PDF_CONFIG_HEX="${LOCAL_PDF_CONFIG_DIGEST#sha256:}"
          [[ "$PDF_CONFIG_HEX" =~ ^[0-9a-f]{64}$ ]]
          PDF_REGISTRY_IMAGE_TAG="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-pdf-engine:$EXPECTED_HEAD_SHA-$PDF_CONFIG_HEX"
          docker tag "hereisit-pdf-engine:$EXPECTED_HEAD_SHA" "$PDF_REGISTRY_IMAGE_TAG"
          pnpm exec wrangler containers push "$PDF_REGISTRY_IMAGE_TAG"
          for attempt in {1..30}; do
            if docker manifest inspect -v "$PDF_REGISTRY_IMAGE_TAG" \
                > .artifacts/runtime/cloudflare-pdf-container-manifest.json 2>/dev/null &&
              node scripts/resolve-cloudflare-image-digest.mjs \
                --manifest .artifacts/runtime/cloudflare-pdf-container-manifest.json \
                --expected-config-digest "$LOCAL_PDF_CONFIG_DIGEST" \
                --image-ref "$PDF_REGISTRY_IMAGE_TAG" --account-id "$CLOUDFLARE_ACCOUNT_ID" \
                --output .artifacts/deployment/cloudflare-pdf-image-digest.txt; then
              break
            fi
            (( attempt < 30 )) || exit 1
            sleep 5
          done
          echo "PDF_ENGINE_IMAGE=$(cat .artifacts/deployment/cloudflare-pdf-image-digest.txt)" >> "$GITHUB_ENV"
      - name: Provision resources and deploy the bootstrap Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_STATUS_TOKEN: ${{ secrets.STAGING_LOGPUSH_STATUS_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
          STAGING_MAINTAINER_HASHES_JSON: ${{ secrets.STAGING_MAINTAINER_HASHES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/ensure-cloudflare-processing-resources.mjs \
            --phase provision \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --environment staging \
            --location apac \
            --bucket-name "$BUCKET_NAME" \
            --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
            --usage-analytics-dataset-name "$USAGE_ANALYTICS_DATASET_NAME" \
            --worker-script-name "$WORKER_SCRIPT_NAME" \
            --database-name "$D1_NAME" \
            --queue-name "$QUEUE_NAME" \
            --dlq-name "$DLQ_NAME" \
            --pdf-queue-name "$PDF_QUEUE_NAME" \
            --pdf-dlq-name "$PDF_DLQ_NAME" \
            --output .artifacts/runtime/resources-staging.json
          STAGING_D1_DATABASE_ID="$(node scripts/read-processing-provision-manifest.mjs \
            --file .artifacts/runtime/resources-staging.json --field d1.databaseId)"
          STAGING_LOGPUSH_JOB_ID="$(node scripts/read-processing-provision-manifest.mjs \
            --file .artifacts/runtime/resources-staging.json --field logpush.jobId)"

          generate_config() {
            node scripts/generate-processing-wrangler.mjs \
              --environment staging \
              --account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --database-id "$STAGING_D1_DATABASE_ID" \
              --app-origin http://127.0.0.1:4173 \
              --app-origin http://localhost:4173 \
              --app-origin "$STAGING_PAGES_ORIGIN" \
              --bucket-name "$BUCKET_NAME" \
              --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
              --usage-analytics-dataset-name "$USAGE_ANALYTICS_DATASET_NAME" \
              --product-analytics-dataset-name "$PRODUCT_ANALYTICS_DATASET_NAME" \
              --cost-accounting-mode "$1" \
              --logpush-job-id "$STAGING_LOGPUSH_JOB_ID" \
              --container-application-id "$2" \
              --pdf-container-application-id "$3" \
              --queue-name "$QUEUE_NAME" \
              --dlq-name "$DLQ_NAME" \
              --engine-image "$ENGINE_IMAGE" \
              --pdf-queue-name "$PDF_QUEUE_NAME" \
              --pdf-dlq-name "$PDF_DLQ_NAME" \
              --pdf-engine-image "$PDF_ENGINE_IMAGE" \
              --account-daily-weighted-unit-limit 80000000000 \
              --anonymous-daily-weighted-unit-limit 8000000000 \
              --network-daily-weighted-unit-limit 24000000000 \
              --account-pending-job-limit 10 \
              --network-pending-job-limit 3 \
              --maximum-queued-age-seconds 600 \
              --max-live-median-output-ratio-bps 8500 \
              --max-live-p95-weighted-units 150000000 \
              --max-live-original-retained-rate-bps 7000 \
              --max-live-cost-per-1000-microusd 500000 \
              --max-projected-monthly-cost-microusd 5000000 \
              --live-cost-model .artifacts/runtime/live-cost-model.json \
              --live-cost-model-sha256 "$LIVE_COST_MODEL_SHA256" \
              --provider-usage-schema-sha256 "$PROVIDER_USAGE_SCHEMA_SHA256" \
              --release-report-sha256 "$REPORT_SHA256" \
              --pdf-public-admission-json "$(node -e 'process.stdout.write(JSON.stringify({costPassed:false,deletionPassed:false,enabled:false,releaseReportSha256:process.argv[1],rollbackPassed:false,schema:"hereisit-pdf-public-admission@1",visualProfilesMeasured:0}))' "$REPORT_SHA256")" \
              --session-rate-limit-namespace-id 21001 \
              --network-rate-limit-namespace-id 21002 \
              --job-read-rate-limit-namespace-id 21003 \
              --result-download-rate-limit-namespace-id 21004 \
              --policy-rate-limit-namespace-id 21005 \
              --job-api-network-rate-limit-namespace-id 21006 \
              --product-analytics-rate-limit-namespace-id 21007 \
              --alert-destination-address "$ALERT_DESTINATION_ADDRESS" \
              --maintainer-session-hashes-json "$STAGING_MAINTAINER_HASHES_JSON" \
              --rollout-percent 0
          }

          generate_config bootstrap 00000000-0000-4000-8000-000000000000 00000000-0000-4000-8000-000000000000
          pnpm exec wrangler deploy "$WORKER_MODULE" \
            --config "$WRANGLER_CONFIG" --no-bundle --containers-rollout none --dry-run
          pnpm exec wrangler d1 migrations apply "$D1_NAME" \
            --config "$WRANGLER_CONFIG" --remote
          ATTESTED_ACTIVE_VERSION_ID="$(node scripts/resolve-previous-active-worker-version.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$STAGING_D1_DATABASE_ID" \
            --attestation-only true)"
          if ! pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/deployment-unreconciled.json \
            2> .artifacts/runtime/deployment-unreconciled.stderr; then
            if grep -Fq '[code: 10007]' .artifacts/runtime/deployment-unreconciled.stderr; then
              printf '{"versions":[]}\n' > .artifacts/runtime/deployment-unreconciled.json
            else
              cat .artifacts/runtime/deployment-unreconciled.stderr >&2
              exit 1
            fi
          fi
          rm -f .artifacts/runtime/deployment-unreconciled.stderr
          if [[ "$ATTESTED_ACTIVE_VERSION_ID" != none ]] &&
            ! node --input-type=module - "$ATTESTED_ACTIVE_VERSION_ID" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { verifyActiveWorkerDeployment } from "./scripts/verify-worker-version-chain.mjs";
          const deployment = JSON.parse(
            await readFile(".artifacts/runtime/deployment-unreconciled.json", "utf8"),
          );
          verifyActiveWorkerDeployment(deployment, process.argv[2], "attested Worker");
          NODE
          then
            pnpm exec wrangler versions deploy "$ATTESTED_ACTIVE_VERSION_ID@100%" \
              --config "$WRANGLER_CONFIG" --yes
          fi
          if ! pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-before.json \
            2> .artifacts/runtime/versions-before.stderr; then
            if grep -Fq '[code: 10007]' .artifacts/runtime/versions-before.stderr; then
              printf '[]\n' > .artifacts/runtime/versions-before.json
            else
              cat .artifacts/runtime/versions-before.stderr >&2
              exit 1
            fi
          fi
          rm -f .artifacts/runtime/versions-before.stderr
          if ! pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/deployment-before.json \
            2> .artifacts/runtime/deployment-before.stderr; then
            if grep -Fq '[code: 10007]' .artifacts/runtime/deployment-before.stderr; then
              printf '{"versions":[]}\n' > .artifacts/runtime/deployment-before.json
            else
              cat .artifacts/runtime/deployment-before.stderr >&2
              exit 1
            fi
          fi
          rm -f .artifacts/runtime/deployment-before.stderr
          PREVIOUS_ACTIVE_VERSION_ID="$(node scripts/resolve-previous-active-worker-version.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$STAGING_D1_DATABASE_ID" \
            --deployment .artifacts/runtime/deployment-before.json)"
          test "$PREVIOUS_ACTIVE_VERSION_ID" = "$ATTESTED_ACTIVE_VERSION_ID"
          : > .artifacts/runtime/bootstrap-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/bootstrap-deploy.ndjson \
            pnpm exec wrangler deploy "$WORKER_MODULE" \
              --config "$WRANGLER_CONFIG" --no-bundle --containers-rollout immediate
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-after-bootstrap.json
          pnpm exec wrangler containers list --json \
            > .artifacts/runtime/container-inventory.json
          STAGING_CONTAINER_APPLICATION_ID="$(node scripts/resolve-cloudflare-container-application.mjs \
            --mode discover \
            --input .artifacts/runtime/container-inventory.json \
            --environment staging \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name ImageEngineContainer)"
          for attempt in {1..90}; do
            if pnpm exec wrangler containers info "$STAGING_CONTAINER_APPLICATION_ID" \
                > .artifacts/runtime/container-application.json \
                2> .artifacts/runtime/container-application-verify.stderr &&
              node scripts/resolve-cloudflare-container-application.mjs \
                --mode verify \
                --input .artifacts/runtime/container-application.json \
                --output .artifacts/runtime/container-provider-scope.json \
                --environment staging \
                --account-id "$CLOUDFLARE_ACCOUNT_ID" \
                --worker-script-name "$WORKER_SCRIPT_NAME" \
                --container-class-name ImageEngineContainer \
                --application-id "$STAGING_CONTAINER_APPLICATION_ID" \
                --engine-image "$ENGINE_IMAGE" \
                --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                2>> .artifacts/runtime/container-application-verify.stderr; then
              break
            fi
            if (( attempt == 90 )); then
              cat .artifacts/runtime/container-application-verify.stderr >&2
              exit 1
            fi
            sleep 10
          done
          rm -f .artifacts/runtime/container-application-verify.stderr
          STAGING_PDF_CONTAINER_APPLICATION_ID="$(node scripts/resolve-cloudflare-container-application.mjs \
            --mode discover --input .artifacts/runtime/container-inventory.json --environment staging \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer)"
          pnpm exec wrangler containers info "$STAGING_PDF_CONTAINER_APPLICATION_ID" \
            > .artifacts/runtime/pdf-container-application.json
          node scripts/resolve-cloudflare-container-application.mjs \
            --mode verify --input .artifacts/runtime/pdf-container-application.json \
            --output .artifacts/runtime/pdf-container-provider-scope.json --environment staging \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer \
            --application-id "$STAGING_PDF_CONTAINER_APPLICATION_ID" \
            --engine-image "$PDF_ENGINE_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          generate_config active "$STAGING_CONTAINER_APPLICATION_ID" "$STAGING_PDF_CONTAINER_APPLICATION_ID"
          node scripts/verify-worker-version-chain.mjs \
            --mode capture-bootstrap \
            --worker-module "$WORKER_MODULE" \
            --config "$WRANGLER_CONFIG" \
            --release-report .artifacts/authority/processing-release-report.json \
            --output .artifacts/runtime/bootstrap-witness.json
          {
            echo "STAGING_D1_DATABASE_ID=$STAGING_D1_DATABASE_ID"
            echo "PREVIOUS_ACTIVE_VERSION_ID=$PREVIOUS_ACTIVE_VERSION_ID"
          } >> "$GITHUB_ENV"
      - name: Install secrets and finalize the active Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          STAGING_ANALYTICS_READ_TOKEN: ${{ secrets.STAGING_ANALYTICS_READ_TOKEN }}
          STAGING_LOGPUSH_STATUS_TOKEN: ${{ secrets.STAGING_LOGPUSH_STATUS_TOKEN }}
          STAGING_ABUSE_HMAC_SECRET_CURRENT: ${{ secrets.STAGING_ABUSE_HMAC_SECRET_CURRENT }}
          STAGING_ABUSE_HMAC_SECRET_PREVIOUS: ${{ secrets.STAGING_ABUSE_HMAC_SECRET_PREVIOUS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$STAGING_ABUSE_HMAC_SECRET_PREVIOUS" | \
            pnpm exec wrangler secret put ABUSE_HMAC_SECRET_PREVIOUS --config "$WRANGLER_CONFIG"
          printf '%s' "$STAGING_ABUSE_HMAC_SECRET_CURRENT" | \
            pnpm exec wrangler secret put ABUSE_HMAC_SECRET_CURRENT --config "$WRANGLER_CONFIG"
          printf '%s' "$STAGING_ANALYTICS_READ_TOKEN" | \
            pnpm exec wrangler secret put ANALYTICS_READ_TOKEN --config "$WRANGLER_CONFIG"
          printf '%s' "$STAGING_LOGPUSH_STATUS_TOKEN" | \
            pnpm exec wrangler secret put LOGPUSH_STATUS_TOKEN --config "$WRANGLER_CONFIG"
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-after-secrets.json
          pnpm exec wrangler secret list --config "$WRANGLER_CONFIG" --format json \
            > .artifacts/runtime/worker-secrets.json
          node scripts/verify-worker-secret-list.mjs --file .artifacts/runtime/worker-secrets.json
          : > .artifacts/runtime/final-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/final-deploy.ndjson \
            pnpm exec wrangler deploy "$WORKER_MODULE" \
              --config "$WRANGLER_CONFIG" --no-bundle --containers-rollout none
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-after-final.json
          DEPLOYED_API_ORIGIN="$(node scripts/read-wrangler-output.mjs \
            --file .artifacts/runtime/final-deploy.ndjson --event deploy --field targets.0)"
          test "$DEPLOYED_API_ORIGIN" = "$STAGING_API_ORIGIN"
          node scripts/verify-worker-version-chain.mjs \
            --mode finalize \
            --before .artifacts/runtime/versions-before.json \
            --after-bootstrap .artifacts/runtime/versions-after-bootstrap.json \
            --after-secrets .artifacts/runtime/versions-after-secrets.json \
            --after-final .artifacts/runtime/versions-after-final.json \
            --bootstrap-output .artifacts/runtime/bootstrap-deploy.ndjson \
            --final-output .artifacts/runtime/final-deploy.ndjson \
            --bootstrap-witness .artifacts/runtime/bootstrap-witness.json \
            --worker-module "$WORKER_MODULE" \
            --config "$WRANGLER_CONFIG" \
            --release-report .artifacts/authority/processing-release-report.json \
            --output .artifacts/runtime/worker-version-attestations.json \
            --previous-active-version-id "$PREVIOUS_ACTIVE_VERSION_ID" \
            --before-deployment .artifacts/runtime/deployment-before.json
          cp .artifacts/runtime/worker-version-attestations.json \
            .artifacts/deployment/worker-version.json
          node scripts/apply-worker-version-attestations.mjs \
            --attestation .artifacts/runtime/worker-version-attestations.json \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$STAGING_D1_DATABASE_ID"
      - name: Begin the release-bound staging cost-accounting epoch
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/rotate-staging-accounting-epoch.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$STAGING_D1_DATABASE_ID" \
            --release-report-sha256 "$REPORT_SHA256"
      - name: Deploy and verify the staging Pages tree
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          : > .artifacts/runtime/pages-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/pages-deploy.ndjson \
            pnpm exec wrangler pages deploy apps/web/out \
              --project-name hereisit \
              --branch processing-staging \
              --commit-hash "$EXPECTED_HEAD_SHA" \
              --commit-dirty=false \
              --no-bundle
          node scripts/read-wrangler-output.mjs \
            --file .artifacts/runtime/pages-deploy.ndjson \
            --event pages-deploy \
            --field deployment_id \
            --expected-pages-project hereisit \
            --expected-branch processing-staging
          node scripts/verify-pages-alias.mjs \
            --pages-output .artifacts/runtime/pages-deploy.ndjson \
            --project hereisit \
            --branch processing-staging \
            --stable-url "$STAGING_PAGES_ORIGIN"
      - name: Verify deployment gate artifacts
        run: |
          set -euo pipefail
          ATTESTATION_SHA256="$(sha256sum .artifacts/runtime/worker-version-attestations.json | cut -d' ' -f1)"
          CONFIG_SHA256="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{64}$/.test(value.generatedConfigSha256 ?? "")) process.exit(1);
            process.stdout.write(value.generatedConfigSha256);' \
            .artifacts/runtime/worker-version-attestations.json)"
          node scripts/verify-deployment-gate-artifacts.mjs \
            --attestation .artifacts/runtime/worker-version-attestations.json \
            --attestation-sha256 "$ATTESTATION_SHA256" \
            --config "$WRANGLER_CONFIG" \
            --config-sha256 "$CONFIG_SHA256" \
            > .artifacts/deployment/gate-results.json
      - name: Install browser smoke runtime while queues remain paused
        run: pnpm exec playwright install --with-deps chromium
      - name: Arm primary queue failure cleanup
        id: resume-attempt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/capture-processing-queue-states.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --image-primary "$QUEUE_NAME" \
            --image-dlq "$DLQ_NAME" --pdf-primary "$PDF_QUEUE_NAME" \
            --pdf-dlq "$PDF_DLQ_NAME" --output .artifacts/runtime/prior-queue-states.json
          echo "attempted=true" >> "$GITHUB_OUTPUT"
      - name: Resume image delivery for the image canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler queues resume-delivery "$QUEUE_NAME"
      - name: Verify the image canary queue isolation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Run authenticated image browser smoke
        env:
          STAGING_MAINTAINER_SESSION_ID: ${{ secrets.STAGING_MAINTAINER_SESSION_ID }}
        run: |
          node scripts/smoke-image-compress-server.mjs \
            --page-origin "$STAGING_PAGES_ORIGIN" \
            --output .artifacts/deployment/smoke-result.json
      - name: Isolate and resume PDF delivery for the PDF canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME"
          pnpm exec wrangler queues resume-delivery "$PDF_QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Run authenticated PDF HTTP smoke
        env:
          STAGING_MAINTAINER_SESSION_ID: ${{ secrets.STAGING_MAINTAINER_SESSION_ID }}
        run: |
          node scripts/smoke-pdf-compress-server.mjs \
            --page-origin "$STAGING_PAGES_ORIGIN" \
            --output .artifacts/deployment/pdf-smoke-result.json
      - name: Restore image delivery and pause PDF delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME"
          pnpm exec wrangler queues resume-delivery "$QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-staging-deployment-${{ github.event.workflow_run.head_sha }}
          path: |
            .artifacts/deployment/source-sha.txt
            .artifacts/deployment/release-authority.json
            .artifacts/deployment/processing-candidate.json
            .artifacts/deployment/processing-release-report.json
            .artifacts/deployment/evidence-public.pem
            .artifacts/authority/**
            .artifacts/deployment/cloudflare-image-digest.txt
            .artifacts/deployment/cloudflare-pdf-image-digest.txt
            .artifacts/deployment/worker-version.json
            .artifacts/deployment/gate-results.json
            .artifacts/deployment/smoke-result.json
            .artifacts/deployment/pdf-smoke-result.json
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Re-pause and verify both queues after any failed delivery attempt
        if: always() && steps.resume-attempt.outputs.attempted == 'true' && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CLEANUP_API_TOKEN }}
        run: |
          set +e
          status=0
          restore_queue() {
            key="$1"; name="$2"
            expected="$(node -e 'const s=require(process.argv[1]);process.stdout.write(s.queues[process.argv[2]].state)' .artifacts/runtime/prior-queue-states.json "$key")" || { status=1; return; }
            if [[ "$expected" == resumed ]]; then action=resume-delivery; else action=pause-delivery; fi
            pnpm exec wrangler queues "$action" "$name" || status=1
            node scripts/verify-queue-delivery-state.mjs --queue "$name" --expected "$expected" --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          }
          restore_queue image-primary "$QUEUE_NAME"
          restore_queue image-dlq "$DLQ_NAME"
          restore_queue pdf-primary "$PDF_QUEUE_NAME"
          restore_queue pdf-dlq "$PDF_DLQ_NAME"
          exit "$status"

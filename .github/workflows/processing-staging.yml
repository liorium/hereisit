name: Processing staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a candidate or verify a finalized release
        required: true
        type: choice
        options:
          - build
          - deploy
      release_tag:
        description: Immutable annotated tag (processing-release-YYYY-MM-DD.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: processing-staging-${{ inputs.mode }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.11.0"
  SYFT_IMAGE: ghcr.io/anchore/syft@sha256:2baa4d24d90599840c0100a8d30deaa533821fcd99f405ce6f90e3d225bd836d
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689

jobs:
  build:
    name: Build immutable processing candidate
    if: inputs.mode == 'build' && github.repository == 'liorium/hereisit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Validate immutable tag and release input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_TAG" =~ ^processing-release-([0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*)$ ]]
          RELEASE_ID="${BASH_REMATCH[1]}"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          RELEASE_INPUTS="docs/deployment/releases/$RELEASE_ID/processing-release-inputs.json"
          read -r -a RELEASE_COMMIT < <(git rev-list --parents -n 1 "$GITHUB_SHA")
          test "${#RELEASE_COMMIT[@]}" -eq 2
          test "${RELEASE_COMMIT[0]}" = "$GITHUB_SHA"
          PARENT_SHA="${RELEASE_COMMIT[1]}"
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          mapfile -t RELEASE_CHANGED_PATHS < <(
            git diff-tree --no-commit-id --name-only -r --no-renames "$GITHUB_SHA"
          )
          test "${#RELEASE_CHANGED_PATHS[@]}" -eq 1
          test "${RELEASE_CHANGED_PATHS[0]}" = "$RELEASE_INPUTS"
          test "$(git ls-files --error-unmatch "$RELEASE_INPUTS")" = "$RELEASE_INPUTS"
          node scripts/create-processing-release-inputs.mjs \
            --verify-only "$RELEASE_INPUTS" \
            --schema docs/deployment/processing-release-inputs.schema.json
          EXPECTED_BASE_SOURCE_SHA256="$(printf '%s' "$PARENT_SHA" | sha256sum | cut -d' ' -f1)"
          test "$(node --input-type=module -e \
            'import {readFileSync} from "node:fs"; const input = JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(`${input.releaseId} ${input.baseSourceSha256}`)' \
            "$RELEASE_INPUTS")" = "$RELEASE_ID $EXPECTED_BASE_SOURCE_SHA256"
          {
            echo "RELEASE_ID=$RELEASE_ID"
            echo "RELEASE_INPUTS=$RELEASE_INPUTS"
            echo "STAGING_PROCESSING_API_ORIGIN=https://hereisit-processing-staging.liorium.workers.dev"
            echo "PRODUCTION_PROCESSING_API_ORIGIN=https://hereisit-processing-production.liorium.workers.dev"
          } >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          git diff --exit-code
      - name: Run source verification
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm test:worker
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
          install: true
      - name: Build linux amd64 engine once with two exporters
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts/build
          docker buildx build \
            --file apps/image-engine/Dockerfile \
            --platform linux/amd64 \
            --target production \
            --tag "hereisit-image-engine:$GITHUB_SHA" \
            --output type=oci,dest=.artifacts/build/image-engine-linux-amd64.oci.tar \
            --output type=docker,dest=.artifacts/build/image-engine-linux-amd64.docker.tar \
            .
          docker load --input .artifacts/build/image-engine-linux-amd64.docker.tar
          ENGINE_ID="$(docker image inspect --format '{{.Id}}' "hereisit-image-engine:$GITHUB_SHA")"
          [[ "$ENGINE_ID" =~ ^sha256:([0-9a-f]{64})$ ]]
          echo "ENGINE_CONFIG_SHA256=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Build Worker and isolated web trees
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts/build/api-worker-bundle
          pnpm --filter @hereisit/api-worker exec wrangler deploy \
            --config wrangler.local.jsonc \
            --containers-rollout none \
            --dry-run \
            --outdir "$GITHUB_WORKSPACE/.artifacts/build/api-worker-bundle"
          test -f .artifacts/build/api-worker-bundle/index.js
          cp .artifacts/build/api-worker-bundle/index.js .artifacts/build/api-worker.mjs

          rm -rf apps/web/.next apps/web/out
          NEXT_PUBLIC_PROCESSING_API_ORIGIN="$STAGING_PROCESSING_API_ORIGIN" \
            pnpm --filter @hereisit/web build
          test -d apps/web/out
          cp -a apps/web/out .artifacts/build/web-staging

          rm -rf apps/web/.next apps/web/out
          NEXT_PUBLIC_PROCESSING_API_ORIGIN="$PRODUCTION_PROCESSING_API_ORIGIN" \
            pnpm --filter @hereisit/web build
          test -d apps/web/out
          cp -a apps/web/out .artifacts/build/web-production

          node scripts/create-deterministic-tree-archive.mjs \
            --root .artifacts/build/web-staging \
            --output .artifacts/build/web-staging.tar \
            > .artifacts/build/web-staging-archive.json
          node scripts/create-deterministic-tree-archive.mjs \
            --root .artifacts/build/web-production \
            --output .artifacts/build/web-production.tar \
            > .artifacts/build/web-production-archive.json
          STAGING_WEB_TREE_SHA256="$(node -e \
            'process.stdout.write(require("./.artifacts/build/web-staging-archive.json").treeSha256)')"
          PRODUCTION_WEB_TREE_SHA256="$(node -e \
            'process.stdout.write(require("./.artifacts/build/web-production-archive.json").treeSha256)')"
          {
            echo "STAGING_WEB_TREE_SHA256=$STAGING_WEB_TREE_SHA256"
            echo "PRODUCTION_WEB_TREE_SHA256=$PRODUCTION_WEB_TREE_SHA256"
          } >> "$GITHUB_ENV"
      - name: Generate pinned SBOMs and application license gate
        run: |
          set -euo pipefail
          umask 077
          mkdir -p \
            .artifacts/build/lockfile-scan \
            .artifacts/build/notices \
            .artifacts/build/worker-scan
          cp pnpm-lock.yaml .artifacts/build/lockfile-scan/pnpm-lock.yaml
          cp .artifacts/build/api-worker.mjs .artifacts/build/worker-scan/api-worker.mjs
          node scripts/application-supply-chain.mjs \
            --mode notices \
            --repository . \
            --policy security/application-license-policy.json \
            --lockfile pnpm-lock.yaml \
            --notices-output .artifacts/build/notices/THIRD_PARTY_NOTICES.txt

          WEB_STAGING_SHA256="$(sha256sum .artifacts/build/web-staging.tar | cut -d' ' -f1)"
          WEB_PRODUCTION_SHA256="$(sha256sum .artifacts/build/web-production.tar | cut -d' ' -f1)"
          WORKER_SHA256="$(sha256sum .artifacts/build/api-worker.mjs | cut -d' ' -f1)"
          LOCKFILE_SHA256="$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          {
            echo "WEB_STAGING_SHA256=$WEB_STAGING_SHA256"
            echo "WEB_PRODUCTION_SHA256=$WEB_PRODUCTION_SHA256"
            echo "WORKER_SHA256=$WORKER_SHA256"
            echo "LOCKFILE_SHA256=$LOCKFILE_SHA256"
          } >> "$GITHUB_ENV"

          docker run --rm \
            -v "$PWD/.artifacts/build:/input:ro" \
            -v "$PWD/.artifacts/build:/output" \
            "$SYFT_IMAGE" scan oci-archive:/input/image-engine-linux-amd64.oci.tar \
            --source-name "hereisit-engine:sha256-$ENGINE_CONFIG_SHA256" \
            --output cyclonedx-json@1.6=/output/security-sbom-engine.cdx.json
          docker run --rm \
            -v "$PWD/.artifacts/build/web-staging:/input:ro" \
            -v "$PWD/.artifacts/build:/output" \
            "$SYFT_IMAGE" scan dir:/input \
            --source-name "hereisit-web-staging:sha256-$WEB_STAGING_SHA256" \
            --output cyclonedx-json@1.6=/output/security-sbom-web-staging.cdx.json
          docker run --rm \
            -v "$PWD/.artifacts/build/web-production:/input:ro" \
            -v "$PWD/.artifacts/build:/output" \
            "$SYFT_IMAGE" scan dir:/input \
            --source-name "hereisit-web-production:sha256-$WEB_PRODUCTION_SHA256" \
            --output cyclonedx-json@1.6=/output/security-sbom-web-production.cdx.json
          docker run --rm \
            -v "$PWD/.artifacts/build/worker-scan:/input:ro" \
            -v "$PWD/.artifacts/build:/output" \
            "$SYFT_IMAGE" scan dir:/input \
            --source-name "hereisit-worker:sha256-$WORKER_SHA256" \
            --output cyclonedx-json@1.6=/output/security-sbom-worker.cdx.json
          docker run --rm \
            -v "$PWD/.artifacts/build/lockfile-scan:/input:ro" \
            -v "$PWD/.artifacts/build:/output" \
            "$SYFT_IMAGE" scan dir:/input \
            --source-name "hereisit-lockfile:sha256-$LOCKFILE_SHA256" \
            --output cyclonedx-json@1.6=/output/security-sbom-lockfile.cdx.json

          node scripts/application-supply-chain.mjs \
            --mode verify \
            --repository . \
            --policy security/application-license-policy.json \
            --lockfile pnpm-lock.yaml \
            --notices-output .artifacts/build/notices/THIRD_PARTY_NOTICES.txt \
            --gate-output .artifacts/build/security-application-supply-chain-gate.json \
            --engine-sbom .artifacts/build/security-sbom-engine.cdx.json \
            --engine-artifact-sha256 "$ENGINE_CONFIG_SHA256" \
            --web-staging-sbom .artifacts/build/security-sbom-web-staging.cdx.json \
            --web-staging-artifact-sha256 "$WEB_STAGING_SHA256" \
            --web-production-sbom .artifacts/build/security-sbom-web-production.cdx.json \
            --web-production-artifact-sha256 "$WEB_PRODUCTION_SHA256" \
            --worker-sbom .artifacts/build/security-sbom-worker.cdx.json \
            --worker-artifact-sha256 "$WORKER_SHA256" \
            --lockfile-sbom .artifacts/build/security-sbom-lockfile.cdx.json \
            --lockfile-artifact-sha256 "$LOCKFILE_SHA256"
      - name: Run pinned license and vulnerability gates
        run: |
          set -euo pipefail
          umask 077
          node scripts/verify-image-engine-licenses.mjs \
            --scope pr \
            --image "hereisit-image-engine:$GITHUB_SHA" \
            --artifact-sha256 "$ENGINE_CONFIG_SHA256" \
            --lock apps/image-engine/native/sources.lock.json \
            --policy apps/image-engine/licenses/policy.json \
            --exceptions apps/image-engine/security/vulnerability-exceptions.json \
            --base-lock apps/image-engine/base-images.lock.json \
            --output .artifacts/build/security-image-engine-license-gate.json

          TRIVY_DB_DIGEST="$(
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' \
              ghcr.io/aquasecurity/trivy-db:2 |
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const descriptor = JSON.parse(readFileSync(0, "utf8"));
                if (!/^sha256:[0-9a-f]{64}$/.test(descriptor.digest ?? "")) process.exit(1);
                process.stdout.write(descriptor.digest);
              '
          )"
          [[ "$TRIVY_DB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          TRIVY_DB_REFERENCE="ghcr.io/aquasecurity/trivy-db@$TRIVY_DB_DIGEST"
          {
            echo "TRIVY_DB_REFERENCE=$TRIVY_DB_REFERENCE"
            echo "TRIVY_DB_DIGEST=$TRIVY_DB_DIGEST"
          } >> "$GITHUB_ENV"
          install -d -m 0700 .artifacts/trivy-cache .artifacts/trivy-targets
          docker run --rm \
            -v "$PWD/.artifacts/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --no-progress --download-db-only \
            --db-repository "$TRIVY_DB_REFERENCE"

          docker tag \
            "hereisit-image-engine:$GITHUB_SHA" \
            "hereisit-engine:sha256-$ENGINE_CONFIG_SHA256"
          cp -al \
            .artifacts/build/web-staging \
            ".artifacts/trivy-targets/hereisit-web-staging:sha256-$WEB_STAGING_SHA256"
          cp -al \
            .artifacts/build/web-production \
            ".artifacts/trivy-targets/hereisit-web-production:sha256-$WEB_PRODUCTION_SHA256"
          install -d \
            ".artifacts/trivy-targets/hereisit-worker:sha256-$WORKER_SHA256" \
            ".artifacts/trivy-targets/hereisit-lockfile:sha256-$LOCKFILE_SHA256"
          cp .artifacts/build/api-worker.mjs \
            ".artifacts/trivy-targets/hereisit-worker:sha256-$WORKER_SHA256/api-worker.mjs"
          cp pnpm-lock.yaml \
            ".artifacts/trivy-targets/hereisit-lockfile:sha256-$LOCKFILE_SHA256/pnpm-lock.yaml"

          docker run --rm \
            -v "$PWD/.artifacts/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.artifacts/build:/output" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --image-src docker \
            "hereisit-engine:sha256-$ENGINE_CONFIG_SHA256" \
            --scanners vuln --skip-db-update --offline-scan --no-progress \
            --format json --output /output/security-trivy-engine.json
          docker run --rm \
            -v "$PWD/.artifacts/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.artifacts/trivy-targets:/scan:ro" \
            -v "$PWD/.artifacts/build:/output" \
            -w /scan \
            "$TRIVY_IMAGE" filesystem "hereisit-web-staging:sha256-$WEB_STAGING_SHA256" \
            --scanners vuln --skip-db-update --offline-scan --no-progress \
            --format json --output /output/security-trivy-web-staging.json
          docker run --rm \
            -v "$PWD/.artifacts/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.artifacts/trivy-targets:/scan:ro" \
            -v "$PWD/.artifacts/build:/output" \
            -w /scan \
            "$TRIVY_IMAGE" filesystem "hereisit-web-production:sha256-$WEB_PRODUCTION_SHA256" \
            --scanners vuln --skip-db-update --offline-scan --no-progress \
            --format json --output /output/security-trivy-web-production.json
          docker run --rm \
            -v "$PWD/.artifacts/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.artifacts/trivy-targets:/scan:ro" \
            -v "$PWD/.artifacts/build:/output" \
            -w /scan \
            "$TRIVY_IMAGE" filesystem "hereisit-worker:sha256-$WORKER_SHA256" \
            --scanners vuln --skip-db-update --offline-scan --no-progress \
            --format json --output /output/security-trivy-worker.json
          docker run --rm \
            -v "$PWD/.artifacts/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.artifacts/trivy-targets:/scan:ro" \
            -v "$PWD/.artifacts/build:/output" \
            -w /scan \
            "$TRIVY_IMAGE" filesystem "hereisit-lockfile:sha256-$LOCKFILE_SHA256" \
            --scanners vuln --skip-db-update --offline-scan --no-progress \
            --format json --output /output/security-trivy-lockfile.json

          node scripts/verify-vulnerability-results.mjs \
            --engine-report .artifacts/build/security-trivy-engine.json \
            --engine-artifact-sha256 "$ENGINE_CONFIG_SHA256" \
            --web-staging-report .artifacts/build/security-trivy-web-staging.json \
            --web-staging-artifact-sha256 "$WEB_STAGING_SHA256" \
            --web-production-report .artifacts/build/security-trivy-web-production.json \
            --web-production-artifact-sha256 "$WEB_PRODUCTION_SHA256" \
            --worker-report .artifacts/build/security-trivy-worker.json \
            --worker-artifact-sha256 "$WORKER_SHA256" \
            --lockfile-report .artifacts/build/security-trivy-lockfile.json \
            --lockfile-artifact-sha256 "$LOCKFILE_SHA256" \
            --scanner-policy security/vulnerability-scan-policy.json \
            --engine-exceptions apps/image-engine/security/vulnerability-exceptions.json \
            --application-exceptions security/application-vulnerability-exceptions.json \
            --trivy-db-digest "$TRIVY_DB_DIGEST" \
            --output .artifacts/build/security-vulnerability-gate.json
      - name: Create and verify built candidate
        run: |
          set -euo pipefail
          umask 077
          cp "$RELEASE_INPUTS" .artifacts/build/processing-release-inputs.json
          node scripts/create-live-cost-model.mjs \
            --release-inputs "$RELEASE_INPUTS" \
            --schema docs/deployment/live-cost-model.schema.json \
            --output .artifacts/build/live-cost-model.json
          node scripts/create-processing-candidate.mjs \
            --source-root .artifacts/build \
            --output-root .artifacts/built-candidate \
            --release-id "$RELEASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --staging-processing-api-origin "$STAGING_PROCESSING_API_ORIGIN" \
            --production-processing-api-origin "$PRODUCTION_PROCESSING_API_ORIGIN" \
            --staging-web-tree-sha256 "$STAGING_WEB_TREE_SHA256" \
            --production-web-tree-sha256 "$PRODUCTION_WEB_TREE_SHA256" \
            --trivy-db-digest "$TRIVY_DB_DIGEST" \
            --provider-usage-schema docs/deployment/provider-usage-schema.v1.json \
            > .artifacts/processing-candidate-creation.json
          node scripts/verify-processing-candidate.mjs \
            --manifest .artifacts/built-candidate/processing-candidate.json \
            --root .artifacts/built-candidate \
            --required-state built \
            --expected-git-sha "$GITHUB_SHA" \
            > .artifacts/processing-candidate-identity.json
      - name: Publish built candidate for trusted review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: processing-built-candidate-${{ github.sha }}
          path: |
            .artifacts/built-candidate
            .artifacts/processing-candidate-creation.json
            .artifacts/processing-candidate-identity.json
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  verify-release:
    name: Verify finalized signed release
    if: inputs.mode == 'deploy' && github.repository == 'liorium/hereisit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.handoff.outputs.artifact_name }}
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
      artifact_digest: ${{ steps.publish.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download exact immutable release namespace
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_TAG" =~ ^processing-release-([0-9]{4}-[0-9]{2}-[0-9]{2}\.[1-9][0-9]*)$ ]]
          RELEASE_ID="${BASH_REMATCH[1]}"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          RELEASE_INPUTS="docs/deployment/releases/$RELEASE_ID/processing-release-inputs.json"
          read -r -a RELEASE_COMMIT < <(git rev-list --parents -n 1 "$GITHUB_SHA")
          test "${#RELEASE_COMMIT[@]}" -eq 2
          test "${RELEASE_COMMIT[0]}" = "$GITHUB_SHA"
          PARENT_SHA="${RELEASE_COMMIT[1]}"
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          mapfile -t RELEASE_CHANGED_PATHS < <(
            git diff-tree --no-commit-id --name-only -r --no-renames "$GITHUB_SHA"
          )
          test "${#RELEASE_CHANGED_PATHS[@]}" -eq 1
          test "${RELEASE_CHANGED_PATHS[0]}" = "$RELEASE_INPUTS"
          test "$(git ls-files --error-unmatch "$RELEASE_INPUTS")" = "$RELEASE_INPUTS"
          node scripts/create-processing-release-inputs.mjs \
            --verify-only "$RELEASE_INPUTS" \
            --schema docs/deployment/processing-release-inputs.schema.json
          EXPECTED_BASE_SOURCE_SHA256="$(printf '%s' "$PARENT_SHA" | sha256sum | cut -d' ' -f1)"
          test "$(node --input-type=module -e \
            'import {readFileSync} from "node:fs"; const input = JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(`${input.releaseId} ${input.baseSourceSha256}`)' \
            "$RELEASE_INPUTS")" = "$RELEASE_ID $EXPECTED_BASE_SOURCE_SHA256"
          mkdir -p .artifacts/release-download .artifacts/verification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "candidate-v1--$RELEASE_ID--*" \
            --pattern "evidence-v1--$RELEASE_ID--*" \
            --dir .artifacts/release-download
          node scripts/materialize-processing-release-candidate.mjs \
            --release-tag "$RELEASE_TAG" \
            --download-root .artifacts/release-download \
            --output-root .artifacts/candidate \
            --expected-git-sha "$GITHUB_SHA" \
            > .artifacts/verification/materialization.json
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
      - name: Resolve and independently hash all release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/resolve-github-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --candidate-root .artifacts/candidate \
            --output .artifacts/verification/processing-release-assets.json
          for asset in \
            security-image-engine-license-gate.json \
            security-application-supply-chain-gate.json \
            security-vulnerability-gate.json \
            security-sbom-engine.cdx.json \
            security-sbom-web-staging.cdx.json \
            security-sbom-web-production.cdx.json \
            security-sbom-worker.cdx.json \
            security-sbom-lockfile.cdx.json \
            security-trivy-engine.json \
            security-trivy-web-staging.json \
            security-trivy-web-production.json \
            security-trivy-worker.json \
            security-trivy-lockfile.json
          do
            test -f ".artifacts/candidate/$asset"
          done
      - name: Verify finalized candidate, report, and detached signature
        run: |
          set -euo pipefail
          node scripts/verify-processing-candidate.mjs \
            --manifest .artifacts/candidate/processing-candidate.json \
            --root .artifacts/candidate \
            --required-state finalized \
            --expected-git-sha "$GITHUB_SHA" \
            > .artifacts/verification/processing-candidate-identity.json
          node scripts/verify-processing-release-report.mjs \
            --candidate-root .artifacts/candidate \
            --candidate-manifest .artifacts/candidate/processing-candidate.json \
            --evidence-bundle ".artifacts/candidate/evidence-v1--$RELEASE_ID--processing-evidence.json" \
            --evidence-signature ".artifacts/candidate/evidence-v1--$RELEASE_ID--processing-evidence.sig" \
            --public-key docs/deployment/processing-evidence-ed25519-public.pem \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --report .artifacts/candidate/processing-release-report.json \
            > .artifacts/verification/processing-release-report.json
          node scripts/processing-evidence-signature.mjs \
            --mode verify \
            --bundle ".artifacts/candidate/evidence-v1--$RELEASE_ID--processing-evidence.json" \
            --signature ".artifacts/candidate/evidence-v1--$RELEASE_ID--processing-evidence.sig" \
            --public-key docs/deployment/processing-evidence-ed25519-public.pem \
            > .artifacts/verification/processing-evidence-signature.json
      - name: Bind verified candidate artifact name
        id: handoff
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "artifact_name=processing-verified-candidate-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish digest-bound verified candidate
        id: publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: .artifacts/candidate
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

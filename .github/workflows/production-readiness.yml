name: Production readiness monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-monitor
  cancel-in-progress: false

jobs:
  readiness:
    if: github.repository == 'liorium/hereisit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the existing policy contract dependency only
        run: pnpm install --filter @hereisit/tool-contracts --prod --frozen-lockfile --ignore-scripts
      - name: Check public pages, API readiness, and anonymous image admission
        run: node scripts/check-production-health.mjs

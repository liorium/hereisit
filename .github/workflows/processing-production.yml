name: Processing production

on:
  workflow_run:
    workflows: ["Processing staging"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: processing-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.11.0"

jobs:
  deploy:
    name: Deploy successful staging commit as production maintainer canary
    if: >-
      github.repository == 'liorium/hereisit' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: processing-production
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ALERT_DESTINATION_ADDRESS: ${{ vars.ALERT_DESTINATION_ADDRESS }}
      WORKER_SCRIPT_NAME: hereisit-processing-production
      D1_NAME: hereisit-processing-production
      BUCKET_NAME: hereisit-processing-production
      USAGE_LOG_BUCKET_NAME: hereisit-processing-usage-production
      USAGE_ANALYTICS_DATASET_NAME: hereisit_processing_usage_production
      PRODUCT_ANALYTICS_DATASET_NAME: hereisit_product_usage_production
      QUEUE_NAME: hereisit-image-jobs-production
      DLQ_NAME: hereisit-image-jobs-dlq-production
      PDF_QUEUE_NAME: hereisit-pdf-jobs-production
      PDF_DLQ_NAME: hereisit-pdf-jobs-dlq-production
      WRANGLER_CONFIG: .wrangler/generated/wrangler.production.jsonc
      WORKER_MODULE: .artifacts/build/api-worker.mjs
      PRODUCTION_API_ORIGIN: https://api.hereisit.app
      PRODUCTION_PAGES_ORIGIN: https://hereisit.app
      LEGACY_PRODUCTION_PAGES_ORIGIN: https://hereisit.pages.dev
      CANARY_DAILY_WEIGHTED_UNIT_LIMIT: "5000000000"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: processing-staging-deployment-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/staging
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          git diff --exit-code
      - name: Bind the exact successful staging deployment
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"
          test "$(cat .artifacts/staging/source-sha.txt)" = "$EXPECTED_HEAD_SHA"
          REPORT_SHA256="$(shasum -a 256 .artifacts/staging/authority/processing-release-report.json | cut -d' ' -f1)"
          RELEASE_ID="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/staging/authority/processing-candidate.json --field releaseId)"
          node scripts/verify-processing-deployment-authority.mjs \
            --candidate-root .artifacts/staging/authority \
            --candidate-manifest .artifacts/staging/authority/processing-candidate.json \
            --evidence-bundle ".artifacts/staging/authority/evidence-v1--$RELEASE_ID--processing-evidence.json" \
            --evidence-signature ".artifacts/staging/authority/evidence-v1--$RELEASE_ID--processing-evidence.sig" \
            --public-key .artifacts/staging/authority/evidence-public.pem \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --report .artifacts/staging/authority/processing-release-report.json \
            --expected-git-sha "$EXPECTED_HEAD_SHA" --expected-report-sha256 "$REPORT_SHA256" \
            > .artifacts/staging/release-authority-production.json
          ENGINE_IMAGE="$(cat .artifacts/staging/cloudflare-image-digest.txt)"
          PDF_ENGINE_IMAGE="$(cat .artifacts/staging/cloudflare-pdf-image-digest.txt)"
          [[ "$ENGINE_IMAGE" =~ ^registry\.cloudflare\.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-image-engine@sha256:[0-9a-f]{64}$ ]]
          [[ "$PDF_ENGINE_IMAGE" =~ ^registry\.cloudflare\.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-pdf-engine@sha256:[0-9a-f]{64}$ ]]
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const root = ".artifacts/staging";
          for (const path of ["worker-version.json", "gate-results.json", "smoke-result.json"]) {
            const value = JSON.parse(await readFile(`${root}/${path}`, "utf8"));
            if (value === null || typeof value !== "object" || Array.isArray(value)) process.exit(1);
          }
          const smoke = JSON.parse(await readFile(`${root}/smoke-result.json`, "utf8"));
          if (smoke.passed !== true || smoke.rolloutPercent !== 0 || smoke.maintainerServer !== true) {
            process.exit(1);
          }
          NODE
          mkdir -p .artifacts/build .artifacts/deployment .artifacts/runtime .wrangler/generated
          cp .artifacts/staging/source-sha.txt .artifacts/deployment/source-sha.txt
          cp .artifacts/staging/cloudflare-image-digest.txt \
            .artifacts/deployment/cloudflare-image-digest.txt
          cp .artifacts/staging/cloudflare-pdf-image-digest.txt \
            .artifacts/deployment/cloudflare-pdf-image-digest.txt
          cp -R .artifacts/staging/authority .artifacts/deployment/authority
          printf '%s\n' "$STAGING_RUN_ID" > .artifacts/deployment/staging-run-id.txt
          {
            echo "ENGINE_IMAGE=$ENGINE_IMAGE"
            echo "PDF_ENGINE_IMAGE=$PDF_ENGINE_IMAGE"
            echo "REPORT_SHA256=$REPORT_SHA256"
          } >> "$GITHUB_ENV"
      - name: Validate sealed deployment environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
          PRODUCTION_ANALYTICS_READ_TOKEN: ${{ secrets.PRODUCTION_ANALYTICS_READ_TOKEN }}
          PRODUCTION_LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
          PRODUCTION_ABUSE_HMAC_SECRET_CURRENT: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_CURRENT }}
          PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS }}
          PRODUCTION_MAINTAINER_SESSION_ID: ${{ secrets.PRODUCTION_MAINTAINER_SESSION_ID }}
          PRODUCTION_MAINTAINER_HASHES_JSON: ${{ secrets.PRODUCTION_MAINTAINER_HASHES_JSON }}
        run: node scripts/verify-processing-deployment-environment.mjs --environment production
      - name: Bind isolated canary rate-limit namespace
        env:
          PRODUCTION_MAINTAINER_HASHES_JSON: ${{ secrets.PRODUCTION_MAINTAINER_HASHES_JSON }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from "node:fs";

          const networkRateLimitNamespaceId = `${process.env.GITHUB_RUN_ID}${process.env.GITHUB_RUN_ATTEMPT}`;
          if (!/^[1-9][0-9]*$/.test(networkRateLimitNamespaceId)) {
            throw new TypeError("production canary network rate limit namespace is invalid");
          }
          const configuredHashes = JSON.parse(process.env.PRODUCTION_MAINTAINER_HASHES_JSON);
          if (
            !Array.isArray(configuredHashes) ||
            configuredHashes.some((value) => !/^[0-9a-f]{64}$/.test(value))
          ) {
            throw new TypeError("production maintainer hashes are invalid");
          }
          const hashes = JSON.stringify([...new Set(configuredHashes)].sort());
          console.log(`::add-mask::${hashes}`);
          appendFileSync(
            process.env.GITHUB_ENV,
            `PRODUCTION_CANARY_MAINTAINER_HASHES_JSON=${hashes}\n` +
              `PRODUCTION_CANARY_NETWORK_RATE_LIMIT_NAMESPACE_ID=${networkRateLimitNamespaceId}\n`,
          );
          NODE
      - name: Bind the exact CI-built Worker, production web tree, and cost model
        run: |
          set -euo pipefail
          umask 077
          cp .artifacts/staging/authority/api-worker.mjs "$WORKER_MODULE"
          cp .artifacts/staging/authority/live-cost-model.json .artifacts/runtime/live-cost-model.json
          LIVE_COST_MODEL_SHA256="$(shasum -a 256 .artifacts/runtime/live-cost-model.json | cut -d' ' -f1)"
          PROVIDER_USAGE_SCHEMA_SHA256="$(node scripts/read-processing-candidate.mjs --manifest .artifacts/staging/authority/processing-candidate.json --field providerUsage.schemaSha256)"
          rm -rf apps/web/out
          node scripts/verify-and-extract-tree-archive.mjs \
            --archive .artifacts/staging/authority/web-production.tar \
            --expected-archive-sha256 "$(node scripts/read-processing-candidate.mjs --manifest .artifacts/staging/authority/processing-candidate.json --field web.production.archiveSha256)" \
            --expected-tree-sha256 "$(node scripts/read-processing-candidate.mjs --manifest .artifacts/staging/authority/processing-candidate.json --field web.production.treeSha256)" \
            --output apps/web/out
          {
            echo "LIVE_COST_MODEL_SHA256=$LIVE_COST_MODEL_SHA256"
            echo "PROVIDER_USAGE_SCHEMA_SHA256=$PROVIDER_USAGE_SCHEMA_SHA256"
          } >> "$GITHUB_ENV"
      - name: Capture and arm the complete pre-mutation resource state
        id: mutation-state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node scripts/capture-processing-mutation-state.mjs --mode capture \
            --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-name "$D1_NAME" --bucket-name "$BUCKET_NAME" \
            --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
            --worker-script-name "$WORKER_SCRIPT_NAME" --queue-name "$QUEUE_NAME" \
            --dlq-name "$DLQ_NAME" --pdf-queue-name "$PDF_QUEUE_NAME" \
            --pdf-dlq-name "$PDF_DLQ_NAME" --output .artifacts/runtime/pre-mutation-state.json
          node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));if(!Array.isArray(s.absentResources))process.exit(1)' .artifacts/runtime/pre-mutation-state.json
          echo "armed=true" >> "$GITHUB_OUTPUT"
      - name: Capture and arm the exact prior release before any mutation
        id: prior-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          PRODUCTION_D1_DATABASE_ID="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.resources.d1?.id ?? "none")' .artifacts/runtime/pre-mutation-state.json)"
          PRIOR_IMAGE_APPLICATION_ID="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.resources.containers.image?.id ?? "none")' .artifacts/runtime/pre-mutation-state.json)"
          PRIOR_PDF_APPLICATION_ID="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.resources.containers.pdf?.id ?? "none")' .artifacts/runtime/pre-mutation-state.json)"
          test "$PRODUCTION_D1_DATABASE_ID" != none
          test "$PRIOR_IMAGE_APPLICATION_ID" != none
          test "$PRIOR_PDF_APPLICATION_ID" != none
          PREVIOUS_ACTIVE_VERSION_ID="$(node scripts/resolve-previous-active-worker-version.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --attestation-only true)"
          test "$PREVIOUS_ACTIVE_VERSION_ID" != none
          pnpm exec wrangler deployments status --name "$WORKER_SCRIPT_NAME" --json \
            > .artifacts/runtime/prior-deployment.json
          node --input-type=module - "$PREVIOUS_ACTIVE_VERSION_ID" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { verifyActiveWorkerDeployment } from "./scripts/verify-worker-version-chain.mjs";
          verifyActiveWorkerDeployment(
            JSON.parse(await readFile(".artifacts/runtime/prior-deployment.json", "utf8")),
            process.argv[2],
            "prior Worker",
          );
          NODE
          pnpm exec wrangler versions view "$PREVIOUS_ACTIVE_VERSION_ID" \
            --name "$WORKER_SCRIPT_NAME" --json > .artifacts/runtime/prior-worker-version.json
          node scripts/capture-processing-queue-states.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --image-primary "$QUEUE_NAME" \
            --image-dlq "$DLQ_NAME" --pdf-primary "$PDF_QUEUE_NAME" \
            --pdf-dlq "$PDF_DLQ_NAME" --output .artifacts/runtime/prior-queue-states.json
          node scripts/processing-admission-rollback-state.mjs \
            --mode capture --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --file .artifacts/runtime/prior-admission-state.json
          pnpm exec wrangler containers info "$PRIOR_IMAGE_APPLICATION_ID" \
            > .artifacts/runtime/prior-image-container.json
          pnpm exec wrangler containers info "$PRIOR_PDF_APPLICATION_ID" \
            > .artifacts/runtime/prior-pdf-container.json
          PRIOR_IMAGE="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.configuration.image)' .artifacts/runtime/prior-image-container.json)"
          PRIOR_PDF_IMAGE="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.configuration.image)' .artifacts/runtime/prior-pdf-container.json)"
          [[ "$PRIOR_IMAGE" =~ ^registry\.cloudflare\.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-image-engine@sha256:[0-9a-f]{64}$ ]]
          [[ "$PRIOR_PDF_IMAGE" =~ ^registry\.cloudflare\.com/$CLOUDFLARE_ACCOUNT_ID/hereisit-pdf-engine@sha256:[0-9a-f]{64}$ ]]
          {
            echo "PRODUCTION_D1_DATABASE_ID=$PRODUCTION_D1_DATABASE_ID"
            echo "PREVIOUS_ACTIVE_VERSION_ID=$PREVIOUS_ACTIVE_VERSION_ID"
            echo "PRIOR_IMAGE_APPLICATION_ID=$PRIOR_IMAGE_APPLICATION_ID"
            echo "PRIOR_PDF_APPLICATION_ID=$PRIOR_PDF_APPLICATION_ID"
            echo "PRIOR_IMAGE=$PRIOR_IMAGE"
            echo "PRIOR_PDF_IMAGE=$PRIOR_PDF_IMAGE"
          } >> "$GITHUB_ENV"
          echo "armed=true" >> "$GITHUB_OUTPUT"
      - name: Provision isolated resources and deploy the bootstrap Worker
        id: worker-mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_API_TOKEN }}
          LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          node scripts/ensure-cloudflare-processing-resources.mjs \
            --phase provision \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --environment production \
            --location apac \
            --bucket-name "$BUCKET_NAME" \
            --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
            --usage-analytics-dataset-name "$USAGE_ANALYTICS_DATASET_NAME" \
            --worker-script-name "$WORKER_SCRIPT_NAME" \
            --database-name "$D1_NAME" \
            --queue-name "$QUEUE_NAME" \
            --dlq-name "$DLQ_NAME" \
            --pdf-queue-name "$PDF_QUEUE_NAME" \
            --pdf-dlq-name "$PDF_DLQ_NAME" \
            --output .artifacts/runtime/resources-production.json
          cp .artifacts/runtime/resources-production.json .artifacts/deployment/resources-production.json
          PROVISIONED_D1_DATABASE_ID="$(node scripts/read-processing-provision-manifest.mjs \
            --file .artifacts/runtime/resources-production.json --field d1.databaseId)"
          test "$PROVISIONED_D1_DATABASE_ID" = "$PRODUCTION_D1_DATABASE_ID"
          PRODUCTION_LOGPUSH_JOB_ID="$(node scripts/read-processing-provision-manifest.mjs \
            --file .artifacts/runtime/resources-production.json --field logpush.jobId)"

          generate_config() {
            local daily_limit=0
            local maintainer_hashes='[]'
            if [[ "$1" == active ]]; then
              daily_limit="$CANARY_DAILY_WEIGHTED_UNIT_LIMIT"
              maintainer_hashes="$PRODUCTION_CANARY_MAINTAINER_HASHES_JSON"
            fi
            node scripts/generate-processing-wrangler.mjs \
              --environment production \
              --account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --database-id "$PRODUCTION_D1_DATABASE_ID" \
              --app-origin "$PRODUCTION_PAGES_ORIGIN" \
              --app-origin "$LEGACY_PRODUCTION_PAGES_ORIGIN" \
              --bucket-name "$BUCKET_NAME" \
              --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
              --usage-analytics-dataset-name "$USAGE_ANALYTICS_DATASET_NAME" \
              --product-analytics-dataset-name "$PRODUCT_ANALYTICS_DATASET_NAME" \
              --cost-accounting-mode "$1" \
              --logpush-job-id "$PRODUCTION_LOGPUSH_JOB_ID" \
              --container-application-id "$2" \
              --pdf-container-application-id "$3" \
              --queue-name "$QUEUE_NAME" \
              --dlq-name "$DLQ_NAME" \
              --engine-image "$ENGINE_IMAGE" \
              --pdf-queue-name "$PDF_QUEUE_NAME" \
              --pdf-dlq-name "$PDF_DLQ_NAME" \
              --pdf-engine-image "$PDF_ENGINE_IMAGE" \
              --account-daily-weighted-unit-limit "$daily_limit" \
              --anonymous-daily-weighted-unit-limit "$daily_limit" \
              --network-daily-weighted-unit-limit "$daily_limit" \
              --account-pending-job-limit 10 \
              --network-pending-job-limit 3 \
              --maximum-queued-age-seconds 600 \
              --max-live-median-output-ratio-bps 8500 \
              --max-live-p95-weighted-units 150000000 \
              --max-live-original-retained-rate-bps 7000 \
              --max-live-cost-per-1000-microusd 500000 \
              --max-projected-monthly-cost-microusd 5000000 \
              --live-cost-model .artifacts/runtime/live-cost-model.json \
              --live-cost-model-sha256 "$LIVE_COST_MODEL_SHA256" \
              --provider-usage-schema-sha256 "$PROVIDER_USAGE_SCHEMA_SHA256" \
              --release-report-sha256 "$REPORT_SHA256" \
              --pdf-public-admission-json "$(node -e 'process.stdout.write(JSON.stringify({costPassed:false,deletionPassed:false,enabled:false,releaseReportSha256:process.argv[1],rollbackPassed:false,schema:"hereisit-pdf-public-admission@1",visualProfilesMeasured:0}))' "$REPORT_SHA256")" \
              --session-rate-limit-namespace-id 22001 \
              --network-rate-limit-namespace-id "$PRODUCTION_CANARY_NETWORK_RATE_LIMIT_NAMESPACE_ID" \
              --job-read-rate-limit-namespace-id 22003 \
              --result-download-rate-limit-namespace-id 22004 \
              --policy-rate-limit-namespace-id 22005 \
              --job-api-network-rate-limit-namespace-id 22006 \
              --product-analytics-rate-limit-namespace-id 22007 \
              --alert-destination-address "$ALERT_DESTINATION_ADDRESS" \
              --maintainer-session-hashes-json "$maintainer_hashes" \
              --rollout-percent 0
          }

          generate_config bootstrap 00000000-0000-4000-8000-000000000000 00000000-0000-4000-8000-000000000000
          pnpm exec wrangler deploy "$WORKER_MODULE" \
            --config "$WRANGLER_CONFIG" --no-bundle --containers-rollout none --dry-run
          pnpm exec wrangler d1 migrations apply "$D1_NAME" \
            --config "$WRANGLER_CONFIG" --remote
          ATTESTED_ACTIVE_VERSION_ID="$(node scripts/resolve-previous-active-worker-version.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --attestation-only true)"
          if ! pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/deployment-unreconciled.json \
            2> .artifacts/runtime/deployment-unreconciled.stderr; then
            if grep -Fq '[code: 10007]' .artifacts/runtime/deployment-unreconciled.stderr; then
              printf '{"versions":[]}\n' > .artifacts/runtime/deployment-unreconciled.json
            else
              cat .artifacts/runtime/deployment-unreconciled.stderr >&2
              exit 1
            fi
          fi
          rm -f .artifacts/runtime/deployment-unreconciled.stderr
          if [[ "$ATTESTED_ACTIVE_VERSION_ID" != none ]] &&
            ! node --input-type=module - "$ATTESTED_ACTIVE_VERSION_ID" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { verifyActiveWorkerDeployment } from "./scripts/verify-worker-version-chain.mjs";
          const deployment = JSON.parse(
            await readFile(".artifacts/runtime/deployment-unreconciled.json", "utf8"),
          );
          verifyActiveWorkerDeployment(deployment, process.argv[2], "attested Worker");
          NODE
          then
            pnpm exec wrangler versions deploy "$ATTESTED_ACTIVE_VERSION_ID@100%" \
              --config "$WRANGLER_CONFIG" --yes
          fi
          if ! pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-before.json \
            2> .artifacts/runtime/versions-before.stderr; then
            if grep -Fq '[code: 10007]' .artifacts/runtime/versions-before.stderr; then
              printf '[]\n' > .artifacts/runtime/versions-before.json
            else
              cat .artifacts/runtime/versions-before.stderr >&2
              exit 1
            fi
          fi
          rm -f .artifacts/runtime/versions-before.stderr
          if ! pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/deployment-before.json \
            2> .artifacts/runtime/deployment-before.stderr; then
            if grep -Fq '[code: 10007]' .artifacts/runtime/deployment-before.stderr; then
              printf '{"versions":[]}\n' > .artifacts/runtime/deployment-before.json
            else
              cat .artifacts/runtime/deployment-before.stderr >&2
              exit 1
            fi
          fi
          rm -f .artifacts/runtime/deployment-before.stderr
          PREVIOUS_ACTIVE_VERSION_ID="$(node scripts/resolve-previous-active-worker-version.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --deployment .artifacts/runtime/deployment-before.json)"
          test "$PREVIOUS_ACTIVE_VERSION_ID" = "$ATTESTED_ACTIVE_VERSION_ID"
          test "$PREVIOUS_ACTIVE_VERSION_ID" != none
          : > .artifacts/runtime/bootstrap-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/bootstrap-deploy.ndjson \
            pnpm exec wrangler deploy "$WORKER_MODULE" \
              --config "$WRANGLER_CONFIG" --no-bundle --containers-rollout immediate
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-after-bootstrap.json
          pnpm exec wrangler containers list --json \
            > .artifacts/runtime/container-inventory.json
          PRODUCTION_CONTAINER_APPLICATION_ID="$(node scripts/resolve-cloudflare-container-application.mjs \
            --mode discover \
            --input .artifacts/runtime/container-inventory.json \
            --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name ImageEngineContainer)"
          for attempt in {1..90}; do
            if pnpm exec wrangler containers info "$PRODUCTION_CONTAINER_APPLICATION_ID" \
                > .artifacts/runtime/container-application.json \
                2> .artifacts/runtime/container-application-verify.stderr &&
              node scripts/resolve-cloudflare-container-application.mjs \
                --mode verify \
                --input .artifacts/runtime/container-application.json \
                --output .artifacts/runtime/container-provider-scope.json \
                --environment production \
                --account-id "$CLOUDFLARE_ACCOUNT_ID" \
                --worker-script-name "$WORKER_SCRIPT_NAME" \
                --container-class-name ImageEngineContainer \
                --application-id "$PRODUCTION_CONTAINER_APPLICATION_ID" \
                --engine-image "$ENGINE_IMAGE" \
                --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                2>> .artifacts/runtime/container-application-verify.stderr; then
              break
            fi
            if (( attempt == 90 )); then
              cat .artifacts/runtime/container-application-verify.stderr >&2
              exit 1
            fi
            sleep 10
          done
          rm -f .artifacts/runtime/container-application-verify.stderr
          PRODUCTION_PDF_CONTAINER_APPLICATION_ID="$(node scripts/resolve-cloudflare-container-application.mjs \
            --mode discover --input .artifacts/runtime/container-inventory.json --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer)"
          pnpm exec wrangler containers info "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" \
            > .artifacts/runtime/pdf-container-application.json
          node scripts/resolve-cloudflare-container-application.mjs \
            --mode verify --input .artifacts/runtime/pdf-container-application.json \
            --output .artifacts/runtime/pdf-container-provider-scope.json --environment production \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer \
            --application-id "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID" \
            --engine-image "$PDF_ENGINE_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          generate_config active "$PRODUCTION_CONTAINER_APPLICATION_ID" "$PRODUCTION_PDF_CONTAINER_APPLICATION_ID"
          node scripts/verify-worker-version-chain.mjs \
            --mode capture-bootstrap \
            --worker-module "$WORKER_MODULE" \
            --config "$WRANGLER_CONFIG" \
            --release-report .artifacts/staging/authority/processing-release-report.json \
            --output .artifacts/runtime/bootstrap-witness.json
      - name: Install secrets and finalize the active Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          PRODUCTION_ANALYTICS_READ_TOKEN: ${{ secrets.PRODUCTION_ANALYTICS_READ_TOKEN }}
          PRODUCTION_LOGPUSH_STATUS_TOKEN: ${{ secrets.PRODUCTION_LOGPUSH_STATUS_TOKEN }}
          PRODUCTION_ABUSE_HMAC_SECRET_CURRENT: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_CURRENT }}
          PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS: ${{ secrets.PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PRODUCTION_ABUSE_HMAC_SECRET_PREVIOUS" | \
            pnpm exec wrangler secret put ABUSE_HMAC_SECRET_PREVIOUS --config "$WRANGLER_CONFIG"
          printf '%s' "$PRODUCTION_ABUSE_HMAC_SECRET_CURRENT" | \
            pnpm exec wrangler secret put ABUSE_HMAC_SECRET_CURRENT --config "$WRANGLER_CONFIG"
          printf '%s' "$PRODUCTION_ANALYTICS_READ_TOKEN" | \
            pnpm exec wrangler secret put ANALYTICS_READ_TOKEN --config "$WRANGLER_CONFIG"
          printf '%s' "$PRODUCTION_LOGPUSH_STATUS_TOKEN" | \
            pnpm exec wrangler secret put LOGPUSH_STATUS_TOKEN --config "$WRANGLER_CONFIG"
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-after-secrets.json
          pnpm exec wrangler secret list --config "$WRANGLER_CONFIG" --format json \
            > .artifacts/runtime/worker-secrets.json
          node scripts/verify-worker-secret-list.mjs --file .artifacts/runtime/worker-secrets.json
          : > .artifacts/runtime/final-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/final-deploy.ndjson \
            pnpm exec wrangler deploy "$WORKER_MODULE" \
              --config "$WRANGLER_CONFIG" --no-bundle --containers-rollout none
          sleep 10
          pnpm exec wrangler versions list --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/versions-after-final.json
          DEPLOYED_API_ORIGIN="$(node scripts/read-wrangler-output.mjs \
            --file .artifacts/runtime/final-deploy.ndjson --event deploy \
            --field target --expected-target "$PRODUCTION_API_ORIGIN")"
          test "$DEPLOYED_API_ORIGIN" = "$PRODUCTION_API_ORIGIN"
          node scripts/verify-worker-version-chain.mjs \
            --mode finalize \
            --before .artifacts/runtime/versions-before.json \
            --after-bootstrap .artifacts/runtime/versions-after-bootstrap.json \
            --after-secrets .artifacts/runtime/versions-after-secrets.json \
            --after-final .artifacts/runtime/versions-after-final.json \
            --bootstrap-output .artifacts/runtime/bootstrap-deploy.ndjson \
            --final-output .artifacts/runtime/final-deploy.ndjson \
            --bootstrap-witness .artifacts/runtime/bootstrap-witness.json \
            --worker-module "$WORKER_MODULE" \
            --config "$WRANGLER_CONFIG" \
            --release-report .artifacts/staging/authority/processing-release-report.json \
            --output .artifacts/runtime/worker-version-attestations.json \
            --previous-active-version-id "$PREVIOUS_ACTIVE_VERSION_ID" \
            --before-deployment .artifacts/runtime/deployment-before.json
          cp .artifacts/runtime/worker-version-attestations.json \
            .artifacts/deployment/worker-version.json
          node scripts/apply-worker-version-attestations.mjs \
            --attestation .artifacts/runtime/worker-version-attestations.json \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID"
      - name: Begin the release-bound production cost-accounting epoch
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/rotate-staging-accounting-epoch.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --release-report-sha256 "$REPORT_SHA256"
      - name: Verify both production queues remain paused
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Verify public production policy remains local
        run: |
          node --input-type=module - <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { setTimeout as delay } from "node:timers/promises";
          let passed = false;
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(`${process.env.PRODUCTION_API_ORIGIN}/v1/policy`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                origin: process.env.PRODUCTION_PAGES_ORIGIN,
              },
              body: JSON.stringify({
                contract: "tool-job@1",
                toolContract: "image.optimize@1",
                anonymousSessionId: "018f47a2-65d4-7f31-a377-5afbb8f53f27",
              }),
            });
            const body = await response.json();
            passed =
              response.status === 200 &&
              response.headers.get("access-control-allow-origin") ===
                process.env.PRODUCTION_PAGES_ORIGIN &&
              body.execution === "local" &&
              body.reason === "LOCAL_FALLBACK_REQUIRED" &&
              body.maintainer === false &&
              body.disclosure?.upload === false;
            if (passed) break;
            if (attempt < 60) await delay(2_000);
          }
          if (!passed) {
            throw new Error("production public policy is not maintainer-only");
          }
          await writeFile(
            ".artifacts/deployment/policy-smoke.json",
            `${JSON.stringify({
              schema: "hereisit-processing-production-canary-policy-smoke@1",
              passed: true,
              execution: "local",
              reason: "LOCAL_FALLBACK_REQUIRED",
              upload: false,
              queuesPaused: true,
            })}\n`,
            { flag: "wx", mode: 0o600 },
          );
          NODE
      - name: Deploy and verify the production Pages tree
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          : > .artifacts/runtime/pages-deploy.ndjson
          WRANGLER_OUTPUT_FILE_PATH=.artifacts/runtime/pages-deploy.ndjson \
            pnpm exec wrangler pages deploy apps/web/out \
              --project-name hereisit \
              --branch main \
              --commit-hash "$EXPECTED_HEAD_SHA" \
              --commit-dirty=false \
              --no-bundle
          node scripts/read-wrangler-output.mjs \
            --file .artifacts/runtime/pages-deploy.ndjson \
            --event pages-deploy \
            --field deployment_id \
            --expected-pages-project hereisit \
            --expected-branch main > .artifacts/deployment/pages-deployment-id.txt
          node scripts/verify-pages-alias.mjs \
            --pages-output .artifacts/runtime/pages-deploy.ndjson \
            --project hereisit \
            --branch main \
            --stable-url "$LEGACY_PRODUCTION_PAGES_ORIGIN"
      - name: Verify deployment gate artifacts
        run: |
          set -euo pipefail
          ATTESTATION_SHA256="$(shasum -a 256 .artifacts/runtime/worker-version-attestations.json | cut -d' ' -f1)"
          CONFIG_SHA256="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{64}$/.test(value.generatedConfigSha256 ?? "")) process.exit(1);
            process.stdout.write(value.generatedConfigSha256);' \
            .artifacts/runtime/worker-version-attestations.json)"
          node scripts/verify-deployment-gate-artifacts.mjs \
            --attestation .artifacts/runtime/worker-version-attestations.json \
            --attestation-sha256 "$ATTESTATION_SHA256" \
            --config "$WRANGLER_CONFIG" \
            --config-sha256 "$CONFIG_SHA256" \
            > .artifacts/deployment/gate-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-production-canary-preflight-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/deployment
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Restore the D1-attested Worker after failed canary mutation (fail-closed recovery)
        if: always() && steps.worker-mutation.outputs.attempted == 'true' && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CLEANUP_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_CLEANUP_API_TOKEN }}
        run: |
          set +e
          status=0
          PRODUCTION_D1_DATABASE_ID="$(node scripts/read-processing-provision-manifest.mjs \
            --file .artifacts/runtime/resources-production.json --field d1.databaseId)" || status=1
          node scripts/verify-processing-admission-state.mjs \
            --mode disable-current --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > .artifacts/runtime/rollback-circuit-open.json || status=1
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME" || status=1
          pnpm exec wrangler queues pause-delivery "$DLQ_NAME" || status=1
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME" || status=1
          pnpm exec wrangler queues pause-delivery "$PDF_DLQ_NAME" || status=1
          node scripts/verify-queue-delivery-state.mjs --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          node scripts/verify-queue-delivery-state.mjs --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          node scripts/verify-queue-delivery-state.mjs --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          RESTORE_VERSION_ID="$PREVIOUS_ACTIVE_VERSION_ID"
          pnpm exec wrangler versions deploy "$RESTORE_VERSION_ID@100%" \
            --config "$WRANGLER_CONFIG" --yes || status=1
          pnpm exec wrangler deployments status --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/deployment-restored.json || status=1
          pnpm exec wrangler versions view "$RESTORE_VERSION_ID" --config "$WRANGLER_CONFIG" --json \
            > .artifacts/runtime/restored-worker-version.json || status=1
          cmp .artifacts/runtime/prior-worker-version.json .artifacts/runtime/restored-worker-version.json || status=1
          node --input-type=module - "$RESTORE_VERSION_ID" <<'NODE' || status=1
          import { readFile } from "node:fs/promises";
          import { verifyActiveWorkerDeployment } from "./scripts/verify-worker-version-chain.mjs";
          const deployment = JSON.parse(
            await readFile(".artifacts/runtime/deployment-restored.json", "utf8"),
          );
          verifyActiveWorkerDeployment(deployment, process.argv[2], "restored Worker");
          NODE
          pnpm exec wrangler containers info "$PRIOR_IMAGE_APPLICATION_ID" > .artifacts/runtime/image-container-restored.json || status=1
          node scripts/resolve-cloudflare-container-application.mjs --mode verify \
            --input .artifacts/runtime/image-container-restored.json --output .artifacts/runtime/image-container-restored-scope.json \
            --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name ImageEngineContainer --application-id "$PRIOR_IMAGE_APPLICATION_ID" \
            --engine-image "$PRIOR_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" || status=1
          pnpm exec wrangler containers info "$PRIOR_PDF_APPLICATION_ID" > .artifacts/runtime/pdf-container-restored.json || status=1
          node scripts/resolve-cloudflare-container-application.mjs --mode verify \
            --input .artifacts/runtime/pdf-container-restored.json --output .artifacts/runtime/pdf-container-restored-scope.json \
            --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" --worker-script-name "$WORKER_SCRIPT_NAME" \
            --container-class-name PdfEngineContainer --application-id "$PRIOR_PDF_APPLICATION_ID" \
            --engine-image "$PRIOR_PDF_IMAGE" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" || status=1
          node scripts/processing-admission-rollback-state.mjs \
            --mode restore --account-id "$CLOUDFLARE_ACCOUNT_ID" --database-id "$PRODUCTION_D1_DATABASE_ID" \
            --file .artifacts/runtime/prior-admission-state.json || status=1
          restore_queue() {
            key="$1"; name="$2"
            expected="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.queues[process.argv[2]].state)' .artifacts/runtime/prior-queue-states.json "$key")" || { status=1; return; }
            if [[ "$expected" == resumed ]]; then action=resume-delivery; else action=pause-delivery; fi
            pnpm exec wrangler queues "$action" "$name" || status=1
            node scripts/verify-queue-delivery-state.mjs --queue "$name" --expected "$expected" --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          }
          if [[ "$status" -eq 0 ]]; then
            ROLLBACK_PREREQUISITES_VERIFIED=true
            restore_queue image-primary "$QUEUE_NAME"
            restore_queue image-dlq "$DLQ_NAME"
            restore_queue pdf-primary "$PDF_QUEUE_NAME"
            restore_queue pdf-dlq "$PDF_DLQ_NAME"
          else
            ROLLBACK_PREREQUISITES_VERIFIED=false
          fi
          if [[ "$status" -ne 0 ]]; then
            ROLLBACK_PREREQUISITES_VERIFIED=false
            node scripts/verify-processing-admission-state.mjs \
              --mode disable-current --account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --database-id "$PRODUCTION_D1_DATABASE_ID" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              > .artifacts/runtime/rollback-restore-failed-circuit-open.json || true
            for queue in "$QUEUE_NAME" "$DLQ_NAME" "$PDF_QUEUE_NAME" "$PDF_DLQ_NAME"; do
              pnpm exec wrangler queues pause-delivery "$queue" || true
              node scripts/verify-queue-delivery-state.mjs --queue "$queue" \
                --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID" || true
            done
          fi
          test "$ROLLBACK_PREREQUISITES_VERIFIED" = true
          exit "$status"
      - name: Remove only resources absent before a failed or cancelled production mutation
        if: always() && steps.mutation-state.outputs.armed == 'true' && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CLEANUP_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_CLEANUP_API_TOKEN }}
          CLOUDFLARE_LOGPUSH_API_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_CLEANUP_API_TOKEN }}
          LOGPUSH_STATUS_TOKEN: ${{ secrets.CLOUDFLARE_LOGPUSH_CLEANUP_API_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
        run: |
          node scripts/capture-processing-mutation-state.mjs --mode restore-absent \
            --environment production --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --database-name "$D1_NAME" --bucket-name "$BUCKET_NAME" \
            --usage-log-bucket-name "$USAGE_LOG_BUCKET_NAME" \
            --worker-script-name "$WORKER_SCRIPT_NAME" --queue-name "$QUEUE_NAME" \
            --dlq-name "$DLQ_NAME" --pdf-queue-name "$PDF_QUEUE_NAME" \
            --pdf-dlq-name "$PDF_DLQ_NAME" --input .artifacts/runtime/pre-mutation-state.json

  smoke:
    name: Run production canary from a clean browser runner
    needs: deploy
    environment: processing-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_NAME: hereisit-image-jobs-production
      DLQ_NAME: hereisit-image-jobs-dlq-production
      PDF_QUEUE_NAME: hereisit-pdf-jobs-production
      PDF_DLQ_NAME: hereisit-pdf-jobs-dlq-production
      PRODUCTION_PAGES_ORIGIN: https://hereisit.app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: processing-production-canary-preflight-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/deployment
      - name: Bind the exact production canary preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(cat .artifacts/deployment/source-sha.txt)" = "$EXPECTED_HEAD_SHA"
          test -f .artifacts/deployment/worker-version.json
          test -f .artifacts/deployment/gate-results.json
          test -f .artifacts/deployment/policy-smoke.json
          test -f .artifacts/deployment/pages-deployment-id.txt
      - name: Install the isolated browser smoke runtime
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code
          pnpm exec playwright install chromium
      - name: Arm primary queue failure cleanup
        id: resume-attempt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/capture-processing-queue-states.mjs \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" --image-primary "$QUEUE_NAME" \
            --image-dlq "$DLQ_NAME" --pdf-primary "$PDF_QUEUE_NAME" \
            --pdf-dlq "$PDF_DLQ_NAME" --output .artifacts/runtime/prior-queue-states.json
          echo "attempted=true" >> "$GITHUB_OUTPUT"
      - name: Resume image delivery for the image canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler queues resume-delivery "$QUEUE_NAME"
      - name: Verify the image canary queue isolation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Run authenticated production image canary smoke
        env:
          PRODUCTION_MAINTAINER_SESSION_ID: ${{ secrets.PRODUCTION_MAINTAINER_SESSION_ID }}
        run: |
          node scripts/smoke-image-compress-server.mjs \
            --page-origin "$PRODUCTION_PAGES_ORIGIN" \
            --output .artifacts/deployment/canary-smoke.json
      - name: Isolate and resume PDF delivery for the PDF canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler queues pause-delivery "$QUEUE_NAME"
          pnpm exec wrangler queues resume-delivery "$PDF_QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_DLQ_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Run authenticated production PDF HTTP canary
        env:
          PRODUCTION_MAINTAINER_SESSION_ID: ${{ secrets.PRODUCTION_MAINTAINER_SESSION_ID }}
        run: |
          node scripts/smoke-pdf-compress-server.mjs \
            --page-origin "$PRODUCTION_PAGES_ORIGIN" \
            --output .artifacts/deployment/pdf-canary-smoke.json
      - name: Restore image delivery and pause PDF delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler queues pause-delivery "$PDF_QUEUE_NAME"
          pnpm exec wrangler queues resume-delivery "$QUEUE_NAME"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$QUEUE_NAME" --expected resumed --account-id "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-queue-delivery-state.mjs \
            --queue "$PDF_QUEUE_NAME" --expected paused --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Seal report-bound PDF receipts and the final signed deployment projection
        env:
          PROCESSING_EVIDENCE_PRIVATE_KEY: ${{ secrets.PROCESSING_EVIDENCE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          REPORT_SHA256="$(shasum -a 256 .artifacts/deployment/authority/processing-release-report.json | cut -d' ' -f1)"
          node scripts/create-pdf-deployment-receipts.mjs \
            --report .artifacts/deployment/authority/processing-release-report.json \
            --smoke .artifacts/deployment/pdf-canary-smoke.json \
            --output .artifacts/deployment
          node scripts/create-pdf-public-admission-state.mjs \
            --report .artifacts/deployment/authority/processing-release-report.json \
            --deletion-evidence .artifacts/deployment/pdf-deletion-receipt.json \
            --cost-evidence .artifacts/deployment/pdf-cost-receipt.json \
            --rollback-evidence .artifacts/deployment/pdf-rollback-receipt.json \
            --output .artifacts/deployment/pdf-public-admission.json
          node scripts/create-processing-deployment-report.mjs \
            --release-report .artifacts/deployment/authority/processing-release-report.json \
            --candidate .artifacts/deployment/authority/processing-candidate.json \
            --worker-attestation .artifacts/deployment/worker-version.json \
            --image-digest .artifacts/deployment/cloudflare-image-digest.txt \
            --pdf-digest .artifacts/deployment/cloudflare-pdf-image-digest.txt \
            --resources .artifacts/deployment/resources-production.json \
            --pages-deployment-id .artifacts/deployment/pages-deployment-id.txt \
            --image-canary .artifacts/deployment/canary-smoke.json \
            --pdf-canary .artifacts/deployment/pdf-canary-smoke.json \
            --deletion-receipt .artifacts/deployment/pdf-deletion-receipt.json \
            --cost-receipt .artifacts/deployment/pdf-cost-receipt.json \
            --rollback-receipt .artifacts/deployment/pdf-rollback-receipt.json \
            --admission .artifacts/deployment/pdf-public-admission.json \
            --gate .artifacts/deployment/gate-results.json \
            --policy .artifacts/deployment/policy-smoke.json \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --output .artifacts/deployment/processing-deployment-report.json
          PRIVATE_KEY_PATH="$RUNNER_TEMP/processing-deployment-private-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.pem"
          trap 'rm -f -- "$PRIVATE_KEY_PATH"' EXIT
          printf '%s' "$PROCESSING_EVIDENCE_PRIVATE_KEY" > "$PRIVATE_KEY_PATH"
          chmod 0600 "$PRIVATE_KEY_PATH"
          node scripts/processing-evidence-signature.mjs --mode sign \
            --bundle .artifacts/deployment/processing-deployment-report.json \
            --signature .artifacts/deployment/processing-deployment-report.sig \
            --private-key "$PRIVATE_KEY_PATH" --repository-root .
          node scripts/verify-processing-deployment-report.mjs \
            --report .artifacts/deployment/processing-deployment-report.json \
            --signature .artifacts/deployment/processing-deployment-report.sig \
            --public-key .artifacts/deployment/authority/evidence-public.pem \
            --expected-git-sha "$EXPECTED_HEAD_SHA" \
            --expected-release-report-sha256 "$REPORT_SHA256" \
            --release-report .artifacts/deployment/authority/processing-release-report.json \
            --candidate .artifacts/deployment/authority/processing-candidate.json \
            --worker-attestation .artifacts/deployment/worker-version.json \
            --image-digest .artifacts/deployment/cloudflare-image-digest.txt \
            --pdf-digest .artifacts/deployment/cloudflare-pdf-image-digest.txt \
            --resources .artifacts/deployment/resources-production.json \
            --pages-deployment-id .artifacts/deployment/pages-deployment-id.txt \
            --image-canary .artifacts/deployment/canary-smoke.json \
            --pdf-canary .artifacts/deployment/pdf-canary-smoke.json \
            --deletion-receipt .artifacts/deployment/pdf-deletion-receipt.json \
            --cost-receipt .artifacts/deployment/pdf-cost-receipt.json \
            --rollback-receipt .artifacts/deployment/pdf-rollback-receipt.json \
            --admission .artifacts/deployment/pdf-public-admission.json \
            --gate .artifacts/deployment/gate-results.json \
            --policy .artifacts/deployment/policy-smoke.json \
            > .artifacts/deployment/processing-deployment-report-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: processing-production-canary-${{ github.event.workflow_run.head_sha }}
          path: |
            .artifacts/deployment/source-sha.txt
            .artifacts/deployment/staging-run-id.txt
            .artifacts/deployment/cloudflare-image-digest.txt
            .artifacts/deployment/cloudflare-pdf-image-digest.txt
            .artifacts/deployment/worker-version.json
            .artifacts/deployment/gate-results.json
            .artifacts/deployment/policy-smoke.json
            .artifacts/deployment/pages-deployment-id.txt
            .artifacts/deployment/canary-smoke.json
            .artifacts/deployment/pdf-canary-smoke.json
            .artifacts/deployment/pdf-deletion-receipt.json
            .artifacts/deployment/pdf-cost-receipt.json
            .artifacts/deployment/pdf-rollback-receipt.json
            .artifacts/deployment/pdf-public-admission.json
            .artifacts/deployment/processing-deployment-report.json
            .artifacts/deployment/processing-deployment-report.sig
            .artifacts/deployment/processing-deployment-report-verification.json
            .artifacts/deployment/resources-production.json
            .artifacts/deployment/authority/**
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Re-pause and verify both queues after any failed delivery attempt
        if: always() && steps.resume-attempt.outputs.attempted == 'true' && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CLEANUP_API_TOKEN }}
        run: |
          set +e
          status=0
          restore_queue() {
            key="$1"; name="$2"
            expected="$(node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(s.queues[process.argv[2]].state)' .artifacts/runtime/prior-queue-states.json "$key")" || { status=1; return; }
            if [[ "$expected" == resumed ]]; then action=resume-delivery; else action=pause-delivery; fi
            pnpm exec wrangler queues "$action" "$name" || status=1
            node scripts/verify-queue-delivery-state.mjs --queue "$name" --expected "$expected" --account-id "$CLOUDFLARE_ACCOUNT_ID" || status=1
          }
          restore_queue image-primary "$QUEUE_NAME"
          restore_queue image-dlq "$DLQ_NAME"
          restore_queue pdf-primary "$PDF_QUEUE_NAME"
          restore_queue pdf-dlq "$PDF_DLQ_NAME"
          exit "$status"
